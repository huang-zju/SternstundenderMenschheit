    butterfly = `<div class="sec-title">另 一 种 可 能</div>
      <div class="viewbox">
        <div class="vw">你在第 ${top.id} 瞬 · ${CHAPTERS[top.id-1].title} 偏离史实 ${top.n} 次</div>
        <div class="vx" style="margin-top:8px">${BUTTERFLY[top.id]}</div>
      </div>`;
  }

  $('app').innerHTML = `
    <div class="ending">
      <div class="end-badge">S T E R N S T U N D E N</div>
      <div class="end-title ${S.secrets.length>=RIFT_TOTAL?'secret-title':''}">${title}</div>
      <div class="end-text">${text}</div>

      <div class="statline">
        <span data-k="C">勇气<b>${C}</b></span>
        <span data-k="R">理智<b>${R}</b></span>
        <span data-k="F">命运<b>${F}</b></span>
      </div>

      <div class="sec-title">你 的 星 图</div>
      ${starMapSVG()}
      <div class="small mt" style="text-align:center">${S.seen.length} / ${CHAPTERS.length} 颗星被点亮　·　按你阅读的顺序连成线</div>

      ${butterfly}

      <div class="sec-title">档 案 结 算</div>
      <div class="small" style="line-height:2.1">
        史实引力终值：${S.pull}（最高 ${S.gripMax} / 最低 ${S.pullMin}）<br>
        发现星轨裂缝：${S.secrets.length} / ${RIFT_TOTAL}　·　解锁成就：${S.achs.length} / ${ACHIEVEMENTS.length}<br>
        深思 ${S.deepCount} 次　·　均衡抉择 ${S.balanceCount} 次　·　过载 ${S.overloads.length} 次<br>
        平均决策用时：${S.times.length ? avg(S.times).toFixed(1) : '0'} 秒　·　超时 ${S.timeouts} 次<br>
        本世星命：${S.fate ? fateOf(S.fate).name : '—'}　·　回溯 ${S.rewinds} 次　·　星间对话 ${S.dialogs.length} / ${DIALOGUES.length}
      </div>

      <div class="sec-title">现 实 回 响</div>
      <div class="real-intro">
        合上档案之前，还有一件事：把书里的一分钟，对到你自己的表上。<br>
        <b>茨威格写的不是历史，是十四种人在关键时刻的姿势。</b>而每一种姿势，你今天至少会摆出一次。按你的星图，先给你三面镜子。
      </div>
      <div class="real-grid">
        ${realityPicks().map((id,i)=>realityCardHTML(realityOf(id), i===0 && top ? '偏离最深' : '')).join('')}
      </div>
      <div style="margin-top:14px">
        <button class="btn-sub" id="eReal" style="width:100%;padding:11px;border-radius:10px">◈ 读 完 十 四 面 镜 子</button>
      </div>

      <div class="end-btns">
        <button class="btn-main" id="eCard">生 成 星 轨 卡 片</button>
        <button class="btn-sub" id="eAch">✦ 成 就 墙</button>
        <button class="btn-sub" id="eMap">✧ 星 图 与 视 角</button>
        <button class="btn-sub" id="eAgain">重 走 星 轨</button>
      </div>
    </div>`;

  $('eCard').onclick = ()=> openCard(title);
  $('eAch').onclick = ()=> openAch();
  $('eMap').onclick = ()=> openMap();
  $('eReal').onclick = ()=> openReality();
  $('eAgain').onclick = ()=>{
    const keepEggs = S.eggs.slice(), keepAchs = S.achs.slice();
    try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
    S = blank();
    S.eggs = keepEggs; S.achs = keepAchs;
    META.clears++;
    saveMeta();
    renderShelf();
  };
}

/* ============================================================
   分享卡（Canvas）
   ============================================================ */
function openCard(title){
  const W=880, H=1320;
  const cv = document.createElement('canvas');
  cv.width=W; cv.height=H;
  const g = cv.getContext('2d');
  const FONT = '"Noto Serif SC","Songti SC",serif';

  const bg = g.createLinearGradient(0,0,W,H);
  bg.addColorStop(0,'#0a0812'); bg.addColorStop(0.45,'#12101e'); bg.addColorStop(1,'#1a130b');
  g.fillStyle = bg; g.fillRect(0,0,W,H);

  for(let i=0;i<160;i++){
    const x = Math.random()*W, y = Math.random()*H;
    const r = Math.random()*1.6 + 0.3;
    g.globalAlpha = 0.15 + Math.random()*0.6;
    g.fillStyle = '#ffeab0';
    g.beginPath(); g.arc(x,y,r,0,Math.PI*2); g.fill();
  }
  g.globalAlpha = 1;

  g.textAlign='center';
  g.fillStyle = '#8a7326';
  g.font = `500 15px ${FONT}`;
  g.fillText('S T E R N S T U N D E N   D E R   M E N S C H H E I T', W/2, 92);
  g.fillStyle = '#f6e9b0';
  g.font = `400 40px ${FONT}`;
  g.fillText('人类群星闪耀时', W/2, 152);
  g.fillStyle = '#6f6a58';
  g.font = `400 14px ${FONT}`;
  g.fillText('星 轨 档 案 · 你 的 一 局', W/2, 186);

  g.strokeStyle = 'rgba(212,175,55,.35)';
  g.beginPath(); g.moveTo(80,222); g.lineTo(W-80,222); g.stroke();

  g.fillStyle = '#d4af37';
  g.font = `400 17px ${FONT}`;
  g.fillText('结  局', W/2, 272);
  g.fillStyle = '#ffffff';
  g.font = `400 46px ${FONT}`;
  g.fillText(title, W/2, 336);

  /* 属性 */
  const attrs = [['勇气', S.attrs.C, '#d4574a'], ['理智', S.attrs.R, '#5a9ac8'], ['命运', S.attrs.F, '#a87ac8']];
  attrs.forEach((it,i)=>{
    const cx = W/4*(i*1.34 + 0.66);
    g.fillStyle = '#8a8270'; g.font = `400 15px ${FONT}`;
    g.fillText(it[0], cx, 400);
    g.fillStyle = it[2]; g.font = `400 36px ${FONT}`;
    g.fillText(String(it[1]), cx, 446);
  });

  /* 星图 */
  const ox = 120, oy = 500, sw = W-240, sh = 300;
  const pts = starPoints().map(p=>({ x: ox + p.x/520*sw, y: oy + p.y/300*sh }));
  g.lineWidth = 2;
  for(let i=1;i<S.order.length;i++){
    const A = pts[S.order[i-1]-1], B = pts[S.order[i]-1];
    if(!A||!B) continue;
    g.strokeStyle = 'rgba(212,175,55,.5)';
    g.beginPath(); g.moveTo(A.x,A.y); g.lineTo(B.x,B.y); g.stroke();
  }
  pts.forEach((p,i)=>{
    const on = S.seen.includes(i+1);
    g.beginPath(); g.arc(p.x,p.y, on?7:4.5, 0, Math.PI*2);
    g.fillStyle = on ? '#f6e9b0' : '#2a2740';
    g.fill();
    if(on){ g.strokeStyle='rgba(212,175,55,.6)'; g.lineWidth=2; g.stroke(); }
  });

  /* 统计 */
  let y = 880;
  g.textAlign = 'left';
  g.fillStyle = '#8a8270'; g.font = `400 16px ${FONT}`;
  const lines = [
    `已点亮星辉　${S.seen.length} / ${CHAPTERS.length}`,
    `星轨裂缝　　${S.secrets.length} / ${RIFT_TOTAL}`,
    `史实引力终值　${S.pull}`,
    `解锁成就　　${S.achs.length} / ${ACHIEVEMENTS.length}`,
    `均衡抉择　　${S.balanceCount} 次`,
    `本世星命　　${S.fate ? fateOf(S.fate).name : '未抽取'}`,
  ];
  lines.forEach((t,i)=>{ g.fillText(t, 120, y + i*42); });

  const top = deviationTop();
  if(top){
    g.fillStyle = '#a87ac8'; g.font = `400 15px ${FONT}`;
    g.fillText('偏离史实最深的一瞬', 120, y + 5*42 + 22);
    g.fillStyle = '#e9e3d6'; g.font = `400 21px ${FONT}`;
    g.fillText(`第 ${top.id} 瞬 · ${CHAPTERS[top.id-1].title}（偏离 ${top.n} 次）`, 120, y + 5*42 + 58);
  }

  g.textAlign = 'center';
  g.strokeStyle = 'rgba(212,175,55,.3)';
  g.beginPath(); g.moveTo(80,1180); g.lineTo(W-80,1180); g.stroke();
  g.fillStyle = '#6f6a58'; g.font = `400 14px ${FONT}`;
  g.fillText('「历史真正的戏剧性，不在于英雄，而在于普通人被推到那一分钟。」', W/2, 1226);
  g.fillStyle = '#8a7326'; g.font = `400 13px ${FONT}`;
  g.fillText('星轨档案馆 · 见习记录员', W/2, 1262);

  const url = cv.toDataURL('image/png');
  $('sheet').innerHTML = `
    <div class="panel">
      <h3>星 轨 卡 片</h3>
      <div class="psum">长按保存，或点下面的按钮下载</div>
      <img src="${url}" style="width:100%;border-radius:12px;border:1px solid var(--line);display:block">
      <button class="sheet-btn" id="cDl">下 载 图 片</button>
      <div class="card-note">尺寸 ${W}×${H}，可直接分享</div>
      <button class="sheet-btn" id="cClose" style="background:none;color:var(--dim);border:1px solid var(--line2)">关 上</button>
    </div>`;
  $('overlay').classList.add('on');
  delete $('overlay').dataset.lock;
  $('cDl').onclick = ()=>{
    const a2 = document.createElement('a');
    a2.download = `星轨档案_${title}.png`;
    a2.href = url; a2.click();
  };
  $('cClose').onclick = ()=> $('overlay').classList.remove('on');
}

/* ============================================================
   面板
   ============================================================ */
function openAch(){
  const html = `
    <div class="panel">
      <h3>成 就 墙</h3>
      <div class="psum">已解锁 ${S.achs.length} / ${ACHIEVEMENTS.length}　·　隐藏成就不会提前揭示条件</div>
      <div class="ach-grid">
        ${ACHIEVEMENTS.map(a=>{
          const got = S.achs.includes(a.id);
          const hidden = a.id.startsWith('rift') || ['cipher','resonance','beyond','grip','slip','seer','rewind','dialog3'].includes(a.id);
          const showDesc = got || !hidden;
          return `<div class="ach ${got?'got':''}">
            <div class="an"><span class="mark">${got ? a.icon : '○'}</span>${got ? a.name : (hidden ? '？？？' : a.name)}</div>
            <div class="ad">${showDesc ? a.desc : '尚未解锁的隐藏成就'}</div>
          </div>`;
        }).join('')}
      </div>
      <button class="sheet-btn" id="achClose">返 回</button>
    </div>`;
  $('sheet').innerHTML = html;
  $('overlay').classList.add('on');
  delete $('overlay').dataset.lock;
  $('achClose').onclick = ()=> $('overlay').classList.remove('on');
}

function openMap(){
  const riftHtml = Array.from({length:RIFT_TOTAL},(_,i)=>{
    const n = i+1;
    const got = S.stars.find(x=>x.secret && x.rid===n);
    return `<div class="sm ${got?'lit sec':''}">
      <div class="s1">裂缝 ${n}</div>
      <div class="s2">${got ? '✧ ' + got.name : '· 未发现'}</div>
      <div class="s3">${got ? got.title : '星轨上的空缺'}</div>
    </div>`;
  }).join('');

  const viewHtml = CHAPTERS.map(ch=>{
    const on = S.views.includes(ch.id);
    return `<button class="box ${on?'lit':''}" data-v="${ch.id}" ${on?'':'disabled'} style="--accent:${ch.accent};opacity:${on?1:.42};cursor:${on?'pointer':'default'}">
      <div class="b-no">第 ${ch.id} 瞬</div>
      <div class="b-ti" style="font-size:14px">${ch.otherSide.who}</div>
      <div class="b-ye">${on ? ch.otherSide.title : '未解锁'}</div>
    </button>`;
  }).join('');

  $('sheet').innerHTML = `
    <div class="panel">
      <h3>星 图 与 视 角</h3>
      <div class="psum">正篇星辉 ${S.seen.length} / ${CHAPTERS.length}　·　隐藏星辉 ${S.secrets.length} / ${RIFT_TOTAL}　·　视角 ${S.views.length} / ${CHAPTERS.length}</div>
      ${starMapSVG()}
      <div class="sec-title" style="margin-top:20px">星 轨 裂 缝</div>
      <div class="starmap">${riftHtml}</div>
      <div class="sec-title" style="margin-top:20px">另 一 方 视 角</div>
      <div class="starmap">${viewHtml}</div>
      <button class="sheet-btn" id="mapClose">返 回</button>
    </div>`;
  $('overlay').classList.add('on');
  delete $('overlay').dataset.lock;
  $('mapClose').onclick = ()=> $('overlay').classList.remove('on');
  $('sheet').querySelectorAll('[data-v]').forEach(b=>{
    if(b.disabled) return;
    b.onclick = ()=> openView(Number(b.dataset.v));
  });
}

/* ============================================================
   结局收藏册
   ============================================================ */
function openEndings(){
  $('sheet').innerHTML = `
    <div class="panel">
      <h3>结 局 收 藏</h3>
      <div class="psum">已收下 ${META.endings.length} / ${ENDING_SET.length} 种结局　·　跨周目累计，重走不清空</div>
      ${ENDING_SET.map(e=>{
        const got = META.endings.includes(e.title);
        return `<div class="endgal ${got?'got':''}">
          <div class="e1">${got ? '★ ' : '☆ '}${got ? e.title : '？？？'}</div>
          <div class="e2">${e.hint}</div>
        </div>`;
      }).join('')}
      <div class="small" style="margin-top:10px;line-height:1.9">每一次抵达的结局，都会留在这本册子里。<br>同一扇门，可以走出八种人生。</div>
      <button class="sheet-btn" id="egClose">返 回</button>
    </div>`;
  $('overlay').classList.add('on');
  delete $('overlay').dataset.lock;
  $('egClose').onclick = ()=> $('overlay').classList.remove('on');
}

/* ============================================================
   星间对话
   ============================================================ */
function openDialogues(){
  const avail = DIALOGUES.filter(d=>d.pair.every(id=>S.seen.includes(id)));
  $('sheet').innerHTML = `
    <div class="panel">
      <h3>星 间 对 话</h3>
      <div class="psum">两个都被点亮过的瞬间，会在档案架的深夜里，彼此说几句话</div>
      ${avail.length ? avail.map(d=>{
        const [a,b] = d.pair.map(id=>CHAPTERS[id-1]);
        const seen = S.dialogs.includes(d.id);
        return `<button class="dlg" data-d="${d.id}" style="width:100%;text-align:left;cursor:pointer;font-family:inherit">
          <div class="dw">${a.role} × ${b.role}${seen ? '　· 已听' : ''}</div>
          <div class="dt">${d.title}</div>
          <div class="dd">第 ${a.id} 瞬 × 第 ${b.id} 瞬</div>
        </button>`;
      }).join('') : `<div class="small" style="line-height:2.1">对话需要两颗星同时亮着。<br>再点亮几个瞬间，这里就会开始有声音。</div>`}
      <button class="sheet-btn" id="dlgClose" style="margin-top:14px">返 回</button>
    </div>`;
  $('overlay').classList.add('on');
  delete $('overlay').dataset.lock;
  $('dlgClose').onclick = ()=> $('overlay').classList.remove('on');
  $('sheet').querySelectorAll('[data-d]').forEach(b=>{
    b.onclick = ()=> playDialogue(b.dataset.d);
  });
}

function playDialogue(did){
  const d = DIALOGUES.find(x=>x.id===did);
  if(!d) return;
  if(!S.dialogs.includes(d.id)){ S.dialogs.push(d.id); save(); checkAch(); }
  const [A,B] = d.pair.map(id=>CHAPTERS[id-1]);
  $('sheet').innerHTML = `
    <div class="panel">
      <h3>${d.title}</h3>
      <div class="psum">${A.title} · ${A.role}　×　${B.title} · ${B.role}</div>
      <div class="dlg-line">
        ${d.lines.map((ln,i)=>`<div class="ln ${i%2?'alt':''}"><span class="who">${ln[0]}</span>${ln[1]}</div>`).join('')}
      </div>
      ${d.tail ? `<div class="dlg-tail">档案员批注：${d.tail}</div>` : ''}
      <button class="sheet-btn" id="dlgBack" style="margin-top:16px">回 到 对 话 列 表</button>
    </div>`;
  $('overlay').classList.add('on');
  delete $('overlay').dataset.lock;
  $('dlgBack').onclick = ()=> openDialogues();
}

/* ============================================================
   启动
   ============================================================ */
function bindTop(){
  $('btnHome').onclick = ()=>{
    stopTimer();
    $('overlay').classList.remove('on');
    renderShelf();
  };
  $('btnAch').onclick = ()=> openAch();
  $('btnMap').onclick = ()=> openMap();
  $('overlay').onclick = e=>{
    if(e.target === $('overlay') && !$('overlay').dataset.lock) $('overlay').classList.remove('on');
  };
}

(function boot(){
  bindTop();
  META = loadMeta();
  const saved = loadSaved();
  if(saved) S = Object.assign(blank(), saved);
  S.screen = 'shelf';
  renderShelf();
})();

</script>
</body>
</html>
