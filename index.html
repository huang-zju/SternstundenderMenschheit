<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>人类群星闪耀时 · 星轨档案</title>
<meta name="description" content="十四个人类历史的决定性瞬间，每章三轮抉择。你会成为谁？">
<style>
/* ============================================================
   星轨档案 · 视觉系统
   ============================================================ */
:root{
  --bg:#07070e;
  --panel:#12101b;
  --panel2:#1a1728;
  --gold:#d4af37;
  --gold2:#f6e9b0;
  --gold-dim:#8a7326;
  --ink:#e9e3d6;
  --dim:#8d8570;
  --line:rgba(212,175,55,.18);
  --line2:rgba(255,255,255,.07);
  --C:#d4574a;   /* 勇气 */
  --R:#5a9ac8;   /* 理智 */
  --F:#a87ac8;   /* 命运 */
  --ok:#7fd490;
  --no:#d47f7f;
  --shadow:0 18px 50px -20px rgba(0,0,0,.9);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"Noto Serif SC","Songti SC","STSong","PingFang SC","Microsoft YaHei",Georgia,serif;
  color:var(--ink);
  background:
    radial-gradient(ellipse at 15% 8%, rgba(212,175,55,.10), transparent 48%),
    radial-gradient(ellipse at 85% 92%, rgba(90,60,140,.16), transparent 52%),
    radial-gradient(ellipse at 50% 45%, rgba(30,26,48,.55), transparent 70%),
    linear-gradient(165deg,#07070e 0%,#0e0c18 42%,#141020 100%);
  background-attachment:fixed;
  min-height:100vh;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  line-height:1.7;
}
/* 星尘 */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    radial-gradient(1px 1px at 8% 14%,rgba(255,235,170,.85),transparent),
    radial-gradient(1px 1px at 24% 62%,rgba(255,235,170,.5),transparent),
    radial-gradient(1.6px 1.6px at 42% 22%,rgba(255,235,170,.9),transparent),
    radial-gradient(1px 1px at 63% 76%,rgba(255,235,170,.45),transparent),
    radial-gradient(1.2px 1.2px at 78% 30%,rgba(255,235,170,.7),transparent),
    radial-gradient(1px 1px at 90% 66%,rgba(255,235,170,.5),transparent),
    radial-gradient(1px 1px at 34% 90%,rgba(255,235,170,.4),transparent),
    radial-gradient(1.4px 1.4px at 95% 12%,rgba(255,235,170,.6),transparent),
    radial-gradient(1px 1px at 55% 48%,rgba(255,235,170,.35),transparent);
  animation:twk 7s ease-in-out infinite alternate;
}
@keyframes twk{from{opacity:.45}to{opacity:1}}
/* 纸纹 */
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.05;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
}
.wrap{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:0 16px 72px}

/* ---------- 顶栏 ---------- */
.topbar{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;gap:10px;
  padding:10px 4px;margin:0 -16px 18px;
  padding-left:16px;padding-right:16px;
  background:linear-gradient(180deg,rgba(9,8,16,.96),rgba(9,8,16,.72) 70%,rgba(9,8,16,0));
  backdrop-filter:blur(10px);
}
.tb-title{
  flex:1;text-align:center;font-size:12px;letter-spacing:.22em;color:var(--gold-dim);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.tb-btn{
  background:rgba(255,255,255,.03);border:1px solid var(--line);color:var(--dim);
  font-family:inherit;font-size:11.5px;letter-spacing:.1em;
  padding:6px 11px;border-radius:18px;cursor:pointer;transition:.22s;white-space:nowrap;
}
.tb-btn:hover{color:var(--gold2);border-color:var(--gold);background:rgba(212,175,55,.1)}
.tb-btn .badge{
  display:inline-block;margin-left:5px;padding:0 5px;border-radius:8px;
  background:var(--gold);color:#0b0912;font-size:10px;font-weight:700;
}
.tb-right{display:flex;gap:7px}

/* ---------- 封面 ---------- */
.cover{padding-top:12px;text-align:center;animation:fadeUp .8s ease both}
.cover-sigil{
  width:132px;height:132px;margin:6px auto 20px;position:relative;
  animation:breathe 6s ease-in-out infinite;
}
@keyframes breathe{0%,100%{transform:scale(1);filter:drop-shadow(0 0 14px rgba(212,175,55,.25))}50%{transform:scale(1.04);filter:drop-shadow(0 0 26px rgba(212,175,55,.5))}}
h1.big{
  font-size:clamp(28px,7.4vw,46px);font-weight:400;letter-spacing:.16em;
  background:linear-gradient(180deg,#fff 0%,var(--gold2) 40%,var(--gold) 62%,#8a7326 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 4px 30px rgba(212,175,55,.18);
}
.cover-en{
  font-family:Georgia,serif;font-size:10px;letter-spacing:.5em;
  color:var(--gold-dim);text-transform:uppercase;margin-top:12px;
}
.cover-sub{color:var(--dim);font-size:13.5px;letter-spacing:.18em;margin-top:14px}
.cover-body{
  max-width:600px;margin:26px auto 0;font-size:14.5px;line-height:2.05;
  color:#b8b2a4;text-align:left;
}
.cover-body p{margin-bottom:12px}
.cover-body b{color:var(--gold2);font-weight:400}
.q{
  border-left:2px solid var(--gold);padding:8px 14px;margin:16px 0;
  background:rgba(212,175,55,.05);color:var(--dim);font-style:italic;font-size:13.5px;
}
.cta{display:flex;flex-direction:column;gap:11px;max-width:400px;margin:30px auto 0}
.btn-main{
  background:linear-gradient(180deg,rgba(212,175,55,.24),rgba(212,175,55,.08));
  border:1px solid rgba(212,175,55,.6);color:var(--gold2);
  font-family:inherit;font-size:14.5px;letter-spacing:.2em;
  padding:14px 26px;border-radius:32px;cursor:pointer;transition:.28s;
}
.btn-main:hover{background:var(--gold);color:#0b0912;box-shadow:0 0 34px rgba(212,175,55,.45)}
.btn-sub{
  background:none;border:1px solid var(--line);color:var(--dim);
  font-family:inherit;font-size:13px;letter-spacing:.14em;
  padding:11px 24px;border-radius:32px;cursor:pointer;transition:.24s;
}
.btn-sub:hover{color:var(--gold2);border-color:var(--gold)}
.cover-foot{margin-top:26px;font-size:11.5px;color:#5f5a4c;letter-spacing:.1em}
.hint-secret{
  margin-top:20px;font-size:12px;color:var(--gold-dim);letter-spacing:.1em;
  opacity:0;transition:.6s;
}
.hint-secret.show{opacity:1}

/* ---------- HUD 属性 ---------- */
.hud{
  display:grid;grid-template-columns:repeat(3,1fr);gap:9px;
  margin-bottom:16px;
}
.hud-cell{
  background:rgba(255,255,255,.025);border:1px solid var(--line2);
  border-radius:10px;padding:8px 6px 9px;text-align:center;transition:.3s;
}
.hud-cell .nm{font-size:10px;letter-spacing:.2em;color:var(--dim)}
.hud-cell .vl{font-family:Georgia,serif;font-size:19px;margin-top:2px}
.hud-cell .track{height:3px;background:rgba(255,255,255,.08);border-radius:3px;margin:7px 8px 0;overflow:hidden}
.hud-cell .track i{display:block;height:100%;width:50%;border-radius:3px;transition:width .6s cubic-bezier(.3,.9,.3,1)}
.hud-cell[data-k="C"] .vl{color:var(--C)} .hud-cell[data-k="C"] .track i{background:var(--C);box-shadow:0 0 8px var(--C)}
.hud-cell[data-k="R"] .vl{color:var(--R)} .hud-cell[data-k="R"] .track i{background:var(--R);box-shadow:0 0 8px var(--R)}
.hud-cell[data-k="F"] .vl{color:var(--F)} .hud-cell[data-k="F"] .track i{background:var(--F);box-shadow:0 0 8px var(--F)}
.hud-cell.sat .nm::after{content:' · 饱和';color:#c8a04a;letter-spacing:.06em}
.hud-cell.up{animation:popIn .7s ease}
.hud-cell.down{animation:shakeX .5s ease}
@keyframes popIn{0%{transform:scale(1)}35%{transform:scale(1.14);box-shadow:0 0 22px rgba(127,212,144,.4)}100%{transform:scale(1)}}
@keyframes shakeX{0%,100%{transform:translateX(0)}22%{transform:translateX(-5px)}66%{transform:translateX(5px)}}

/* ---------- 章节页 ---------- */
.chapter{animation:fadeUp .55s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.ch-head{display:flex;gap:16px;align-items:flex-start;margin-bottom:16px}
@media(max-width:600px){.ch-head{flex-direction:column;align-items:center;text-align:center}}
.ch-sigil{
  flex:0 0 112px;width:112px;height:112px;border-radius:14px;
  border:1px solid var(--line);
  background:radial-gradient(circle at 50% 35%,rgba(212,175,55,.14),rgba(0,0,0,.35));
  display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 0 30px rgba(212,175,55,.06),0 10px 30px -14px #000;
}
.ch-sigil svg{width:66px;height:66px}
.ch-info{flex:1;min-width:0}
.ch-idx{font-size:10.5px;letter-spacing:.28em;color:var(--gold-dim)}
.ch-title{font-size:22px;letter-spacing:.1em;color:var(--gold2);margin:5px 0 6px;font-weight:400}
.ch-meta{font-size:12px;color:var(--dim);letter-spacing:.05em;line-height:1.9}
.ch-meta b{color:var(--gold);font-weight:400}
.round-pips{display:flex;gap:6px;margin-top:11px}
.round-pips i{
  width:26px;height:3px;border-radius:3px;background:rgba(255,255,255,.13);transition:.45s;
}
.round-pips i.on{background:var(--gold);box-shadow:0 0 9px rgba(212,175,55,.7)}
.round-pips i.now{background:var(--gold2);animation:pipPulse 1.4s ease-in-out infinite}
@keyframes pipPulse{0%,100%{opacity:1}50%{opacity:.42}}

.story{
  background:rgba(255,255,255,.022);border:1px solid var(--line2);
  border-radius:13px;padding:20px 20px 18px;font-size:15px;line-height:2.05;
  color:#cdc7ba;letter-spacing:.02em;
}
.story p{margin-bottom:12px}
.story p:last-child{margin-bottom:0}
.story b{color:var(--gold2);font-weight:400}
.story .rhyme{
  display:block;margin:14px 0 2px;padding:9px 13px;
  border-left:2px solid var(--gold);background:rgba(212,175,55,.05);
  color:var(--dim);font-style:italic;font-size:13.5px;
}

/* ---------- 计时 ---------- */
.timer-line{display:flex;justify-content:space-between;align-items:center;margin:16px 2px 7px;font-size:11.5px;color:var(--dim);letter-spacing:.08em}
.timer-track{height:4px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden;margin-bottom:18px}
.timer-fill{height:100%;width:100%;border-radius:4px;background:linear-gradient(90deg,var(--gold),var(--C));transition:width .1s linear}
.timer-fill.warn{background:linear-gradient(90deg,var(--C),#ff6b5a)}

/* ---------- 选项 ---------- */
.choices{display:flex;flex-direction:column;gap:11px}
.choice{
  position:relative;text-align:left;width:100%;cursor:pointer;
  background:linear-gradient(180deg,rgba(255,255,255,.038),rgba(255,255,255,.012));
  border:1px solid var(--line2);border-radius:11px;
  padding:15px 17px;color:var(--ink);font-family:inherit;font-size:14.5px;
  line-height:1.65;letter-spacing:.02em;transition:.22s;
  animation:choiceIn .3s ease both;
}
@keyframes choiceIn{from{opacity:.35;transform:translateY(9px)}to{opacity:1;transform:none}}
.choice:hover:not(:disabled){background:rgba(212,175,55,.09);border-color:rgba(212,175,55,.5);transform:translateX(5px)}
.choice:disabled{cursor:default}
.choice .eff{display:block;margin-top:6px;font-size:11.5px;color:var(--dim);letter-spacing:.06em}
.choice .eff .up{color:var(--ok)} .choice .eff .dn{color:var(--no)}
.choice.secret{
  border-color:rgba(168,122,200,.45);
  background:linear-gradient(180deg,rgba(168,122,200,.12),rgba(168,122,200,.03));
}
.choice.secret:hover{background:rgba(168,122,200,.18);border-color:var(--F);transform:translateX(5px)}
.choice.secret .eff{color:var(--F)}
.choice.secret::before{
  content:"✦ 星 轨 裂 缝";position:absolute;top:-8px;left:14px;
  font-size:9.5px;letter-spacing:.2em;color:var(--F);
  background:#0d0b16;padding:0 7px;border-radius:6px;
}

/* ---------- 结果覆盖层 ---------- */
.overlay{
  position:fixed;inset:0;z-index:60;display:none;
  align-items:center;justify-content:center;padding:20px;
  background:rgba(4,3,9,.82);backdrop-filter:blur(6px);
}
.overlay.on{display:flex;animation:fadeIn .3s ease both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet{
  width:100%;max-width:620px;max-height:88vh;overflow-y:auto;
  background:linear-gradient(180deg,#191527,#100d19);
  border:1px solid var(--line);border-radius:16px;
  padding:26px 24px 22px;box-shadow:var(--shadow);
  animation:sheetIn .45s cubic-bezier(.2,.8,.3,1) both;
}
@keyframes sheetIn{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
.sheet::-webkit-scrollbar{width:6px}
.sheet::-webkit-scrollbar-thumb{background:rgba(212,175,55,.3);border-radius:6px}
.sheet-kicker{font-size:10.5px;letter-spacing:.3em;color:var(--gold-dim)}
.sheet h3{font-size:18px;font-weight:400;letter-spacing:.09em;color:var(--gold2);margin:9px 0 15px}
.sheet .res-text{font-size:14.5px;line-height:2.05;color:#c6c0b3}
.sheet .res-text b{color:var(--gold2);font-weight:400}
.gain{
  display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 4px;
}
.gain span{
  font-size:11.5px;letter-spacing:.08em;padding:5px 11px;border-radius:20px;
  background:rgba(255,255,255,.04);border:1px solid var(--line2);color:var(--dim);
}
.gain span.up{color:var(--ok);border-color:rgba(127,212,144,.35);background:rgba(127,212,144,.08)}
.gain span.dn{color:var(--no);border-color:rgba(212,127,127,.35);background:rgba(212,127,127,.08)}
.starline{
  margin:16px 0 4px;padding:13px 15px;border-radius:11px;
  background:rgba(212,175,55,.07);border:1px solid rgba(212,175,55,.35);
}
.starline .sn{color:var(--gold2);font-size:15px;letter-spacing:.14em}
.starline .sd{font-size:12px;color:var(--dim);margin-top:4px}
.starline.secret{background:rgba(168,122,200,.1);border-color:rgba(168,122,200,.45)}
.starline.secret .sn{color:var(--F)}
.toast-ach{
  margin:14px 0 0;padding:12px 15px;border-radius:11px;
  background:linear-gradient(90deg,rgba(212,175,55,.16),rgba(212,175,55,.04));
  border:1px solid var(--gold);
  animation:glow 2.2s ease-in-out infinite alternate;
}
@keyframes glow{from{box-shadow:0 0 0 rgba(212,175,55,0)}to{box-shadow:0 0 26px rgba(212,175,55,.35)}}
.toast-ach .t1{font-size:10.5px;letter-spacing:.26em;color:var(--gold-dim)}
.toast-ach .t2{font-size:15px;color:var(--gold2);letter-spacing:.1em;margin-top:4px}
.toast-ach .t3{font-size:12px;color:var(--dim);margin-top:5px;line-height:1.75}
.sheet-btn{
  display:block;width:100%;margin-top:20px;text-align:center;
  background:linear-gradient(180deg,var(--gold),#a8842a);
  color:#14101c;border:none;padding:14px;border-radius:11px;
  font-family:inherit;font-size:15px;font-weight:700;letter-spacing:.18em;cursor:pointer;
  transition:.24s;
}
.sheet-btn:hover{filter:brightness(1.12)}

/* ---------- 面板（成就 / 星图） ---------- */
.panel{width:100%;max-width:660px}
.panel h3{font-size:19px;font-weight:400;letter-spacing:.16em;color:var(--gold2);margin-bottom:4px}
.panel .psum{font-size:12px;color:var(--dim);margin-bottom:18px;letter-spacing:.06em}
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:10px}
.ach{
  padding:12px 13px;border-radius:11px;border:1px solid var(--line2);
  background:rgba(255,255,255,.02);transition:.25s;
}
.ach .an{font-size:13.5px;color:#5d584b;letter-spacing:.06em;display:flex;align-items:center;gap:6px}
.ach .ad{font-size:11.5px;color:#4a463c;line-height:1.65;margin-top:5px}
.ach.got{border-color:rgba(212,175,55,.42);background:rgba(212,175,55,.07)}
.ach.got .an{color:var(--gold2)}
.ach.got .ad{color:var(--dim)}
.ach .mark{font-size:12px}
.starmap{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:9px}
.sm{
  padding:11px 9px;border-radius:10px;text-align:center;
  border:1px dashed var(--line2);background:rgba(0,0,0,.22);
}
.sm.lit{border-style:solid;border-color:var(--gold);background:rgba(212,175,55,.08)}
.sm .s1{font-size:10px;color:var(--dim);letter-spacing:.14em}
.sm .s2{font-size:12.5px;color:#55503f;margin-top:4px}
.sm.lit .s2{color:var(--gold2)}
.sm .s3{font-size:10.5px;color:#4f4a3d;margin-top:3px}
.sm.sec{border-color:var(--F);background:rgba(168,122,200,.1)}
.sm.sec .s2{color:var(--F)}

/* ---------- 现实回响 ---------- */
.real-intro{
  font-size:13.5px;line-height:2.1;color:#b8b2a4;
  max-width:580px;margin:0 auto 18px;text-align:left;
}
.real-intro b{color:var(--gold2);font-weight:400}
.real-grid{display:grid;grid-template-columns:1fr;gap:11px;text-align:left}
.real-card{
  position:relative;padding:15px 17px 16px 20px;border-radius:12px;
  background:linear-gradient(160deg,rgba(255,255,255,.035),rgba(255,255,255,.012));
  border:1px solid var(--line2);transition:.25s;
}
.real-card::before{
  content:"";position:absolute;left:0;top:16px;bottom:16px;width:2px;
  border-radius:2px;background:linear-gradient(180deg,var(--gold),rgba(212,175,55,0));
}
.real-card:hover{border-color:rgba(212,175,55,.38);background:rgba(212,175,55,.05)}
.real-card .rc-no{font-size:10px;letter-spacing:.22em;color:var(--gold-dim)}
.real-card .rc-ti{font-size:15.5px;color:var(--gold2);letter-spacing:.08em;margin:4px 0 8px}
.real-card .rc-his{
  font-size:12px;color:#7a7360;line-height:1.85;
  padding-bottom:9px;margin-bottom:9px;
  border-bottom:1px dashed rgba(255,255,255,.07);
}
.real-card .rc-now{font-size:13.5px;color:#c6c0b3;line-height:2}
.real-card .rc-now b{color:var(--gold2);font-weight:400}
.real-card .rc-q{
  margin-top:11px;font-size:12.5px;color:#c8a04a;letter-spacing:.04em;line-height:1.8;
}
.real-card .rc-q::before{content:"↳ ";opacity:.65}
.real-tail{
  font-size:12.5px;color:var(--dim);line-height:2;max-width:580px;
  margin:22px auto 0;text-align:center;letter-spacing:.05em;
}

/* ---------- 结局 ---------- */
.ending{text-align:center;animation:fadeUp .9s ease both}
.end-badge{font-size:10.5px;letter-spacing:.42em;color:var(--gold-dim)}
.end-title{
  font-size:clamp(24px,6.2vw,36px);font-weight:400;letter-spacing:.16em;margin:14px 0 18px;
  background:linear-gradient(180deg,#fff,var(--gold2) 55%,var(--gold));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.end-text{font-size:14.5px;line-height:2.15;color:#c6c0b3;max-width:600px;margin:0 auto}
.end-text b{color:var(--gold2);font-weight:400}
.statline{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin:24px 0 6px}
.statline span{font-size:12px;letter-spacing:.08em;color:var(--dim);border:1px solid var(--line2);border-radius:20px;padding:6px 14px}
.statline b{font-family:Georgia,serif;font-weight:400;margin-left:6px}
.statline [data-k="C"] b{color:var(--C)} .statline [data-k="R"] b{color:var(--R)} .statline [data-k="F"] b{color:var(--F)}

.sec-title{font-size:11px;letter-spacing:.34em;color:var(--gold-dim);margin:32px 0 14px}
.end-btns{display:flex;gap:11px;justify-content:center;flex-wrap:wrap;margin-top:30px}
.hr{height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);margin:26px 0;border:none}
.small{font-size:12px;color:var(--dim);letter-spacing:.06em}
.mt{margin-top:16px}

/* 隐藏章节闪光 */
@keyframes goldFlash{
  0%{background-position:-300% 0}
  100%{background-position:300% 0}
}
.secret-title{
  background:linear-gradient(90deg,var(--gold) 0%,#fff 45%,var(--F) 55%,var(--gold) 100%);
  background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:goldFlash 4s linear infinite;
}
/* ============================================================
   档案架（可探索序章）
   ============================================================ */
.shelf-head{text-align:center;padding:6px 0 4px;animation:fadeUp .7s ease both}
.shelf-sigil{width:100px;height:100px;margin:0 auto 14px;animation:breathe 6s ease-in-out infinite}
.shelf h1{
  font-size:clamp(24px,6vw,38px);font-weight:400;letter-spacing:.16em;
  background:linear-gradient(180deg,#fff 0%,var(--gold2) 42%,var(--gold) 64%,#8a7326 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.shelf .lead{font-size:13.5px;color:var(--dim);line-height:2;max-width:580px;margin:14px auto 0;letter-spacing:.03em}
.rack{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(164px,1fr));gap:12px;margin-top:26px;
}
.box{
  position:relative;text-align:left;cursor:pointer;overflow:hidden;
  background:linear-gradient(160deg,rgba(255,255,255,.045),rgba(255,255,255,.012));
  border:1px solid var(--line2);border-radius:12px;padding:14px 14px 13px;
  color:var(--ink);font-family:inherit;transition:.26s cubic-bezier(.2,.7,.3,1);
  animation:fadeUp .6s ease both;
}
.box::after{
  content:'';position:absolute;left:0;top:0;bottom:0;width:2px;
  background:var(--accent);opacity:.55;transition:.26s;
}
.box:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:0 14px 34px -18px var(--accent)}
.box:hover::after{width:4px;opacity:1}
.box .b-no{font-family:Georgia,serif;font-size:10px;letter-spacing:.28em;color:var(--accent)}
.box .b-ti{font-size:16px;letter-spacing:.07em;margin:8px 0 3px;color:#efe9da}
.box .b-ye{font-size:11px;color:var(--dim);letter-spacing:.08em}
.box .b-st{
  margin-top:10px;padding-top:9px;border-top:1px dashed rgba(255,255,255,.08);
  font-size:11px;color:#635d4d;letter-spacing:.06em;
}
.box.lit{border-color:rgba(212,175,55,.42);background:linear-gradient(160deg,rgba(212,175,55,.1),rgba(212,175,55,.02))}
.box.lit .b-st{color:var(--gold2)}
.box.lit .b-ti{color:#fff}
.box .pulse{position:absolute;right:11px;top:11px;width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold);animation:pipPulse 1.6s ease-in-out infinite}
.shelf-actions{display:flex;flex-direction:column;gap:10px;max-width:420px;margin:26px auto 0}
.shelf-tip{margin-top:20px;text-align:center;font-size:11.5px;color:#5f5a4c;letter-spacing:.1em;line-height:1.9}

/* 引力条 */
.grav{margin:-6px 0 14px}
.grav .gl{display:flex;justify-content:space-between;font-size:10.5px;letter-spacing:.16em;color:var(--dim);margin-bottom:5px}
.grav .gl b{font-weight:400;color:var(--gold2)}
.grav .gt{height:3px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden}
.grav .gt i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#3a3450,var(--gold));transition:width .6s cubic-bezier(.3,.9,.3,1)}
.grav-note{font-size:11.5px;letter-spacing:.05em;margin:-8px 0 14px;color:var(--dim);min-height:0}
.grav-note.tight{color:#c8a04a}
.grav-note.loose{color:var(--F)}

/* 深思按钮 */
.timer-line .deep{
  background:rgba(168,122,200,.12);border:1px solid rgba(168,122,200,.45);color:var(--F);
  font-family:inherit;font-size:11px;letter-spacing:.1em;padding:4px 10px;border-radius:14px;
  cursor:pointer;transition:.22s;
}
.timer-line .deep:hover:not(:disabled){background:rgba(168,122,200,.25)}
.timer-line .deep:disabled{opacity:.32;cursor:not-allowed}

/* 选项附加信息 */
.choice .echo{
  display:block;margin-top:7px;padding-left:9px;border-left:2px solid rgba(212,175,55,.5);
  font-size:11.5px;color:var(--gold2);opacity:.85;font-style:italic;letter-spacing:.03em;
}
.choice .sealed-note{display:block;margin-top:6px;font-size:11px;color:#8a8270;letter-spacing:.05em}

/* 上一世回响 */
.echo-mem{
  margin:0 0 14px;padding:10px 14px;border-radius:10px;
  background:rgba(168,122,200,.07);border:1px dashed rgba(168,122,200,.35);
  font-size:12.5px;color:#b39ad0;letter-spacing:.04em;
}
.echo-mem b{color:#d6c2ee;font-weight:400}

/* 星图 SVG */
.starsvg{width:100%;height:auto;display:block;border-radius:14px;background:radial-gradient(ellipse at 50% 40%,rgba(212,175,55,.07),rgba(0,0,0,.35));border:1px solid var(--line2)}
.starsvg .sp{fill:#2a2740;stroke:#4a4460;stroke-width:1.5}
.starsvg .sp.lit{fill:#f6e9b0;stroke:#d4af37;stroke-width:2}
.starsvg .sl{stroke:rgba(212,175,55,.55);stroke-width:1.4;fill:none;
  stroke-dasharray:620;stroke-dashoffset:620;animation:drawLine 1.5s ease forwards}
@keyframes drawLine{to{stroke-dashoffset:0}}
.starsvg .st{fill:#6f6a58;font-size:11px;font-family:Georgia,serif}
.starsvg .st.lit{fill:#d4af37}

/* 另一方视角 */
.viewbox{padding:18px 20px;border-radius:12px;background:rgba(255,255,255,.025);border:1px solid var(--line2)}
.viewbox .vw{font-size:10.5px;letter-spacing:.26em;color:var(--gold-dim)}
.viewbox .vt{font-size:16px;color:var(--gold2);letter-spacing:.09em;margin:7px 0 11px}
.viewbox .vx{font-size:14px;line-height:2.05;color:#c6c0b3}
.viewbox + .viewbox{margin-top:12px}

.card-note{font-size:11.5px;color:var(--dim);letter-spacing:.06em;margin-top:12px;text-align:center}

/* ---------- 星命 ---------- */
.fate-card{
  margin:18px 0 4px;padding:15px 17px;border-radius:12px;
  background:linear-gradient(160deg,rgba(168,122,200,.10),rgba(212,175,55,.04));
  border:1px solid rgba(168,122,200,.4);
}
.fate-card .f-k{font-size:10px;letter-spacing:.3em;color:#a87ac8}
.fate-card .f-n{font-size:17px;color:var(--gold2);letter-spacing:.12em;margin-top:5px}
.fate-card .f-p{font-size:12.5px;color:var(--dim);line-height:1.9;margin-top:6px}
.fate-card .f-ops{display:flex;gap:9px;margin-top:11px}
.fate-card .f-ops .btn-sub{flex:1;padding:9px;font-size:12px}

/* ---------- 星间对话 ---------- */
.dlg{
  padding:14px 15px;border-radius:12px;border:1px solid var(--line2);
  background:linear-gradient(160deg,rgba(255,255,255,.035),rgba(255,255,255,.01));
  margin-bottom:10px;transition:.24s;
}
.dlg:hover{border-color:rgba(212,175,55,.45);background:rgba(212,175,55,.05)}
.dlg .dw{font-size:10.5px;letter-spacing:.22em;color:var(--gold-dim)}
.dlg .dt{font-size:15.5px;color:var(--gold2);letter-spacing:.08em;margin:5px 0 4px}
.dlg .dd{font-size:12px;color:var(--dim);line-height:1.8}
.dlg-line{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.dlg-line .ln{
  padding:11px 14px;border-radius:11px;background:rgba(255,255,255,.03);
  border:1px solid var(--line2);font-size:14px;line-height:1.95;color:#c6c0b3;
}
.dlg-line .ln .who{display:block;font-size:10.5px;letter-spacing:.2em;color:var(--gold);margin-bottom:4px}
.dlg-line .ln.alt{background:rgba(90,154,200,.07);border-color:rgba(90,154,200,.25)}
.dlg-line .ln.alt .who{color:#7fb8d4}
.dlg-tail{
  margin-top:14px;padding:11px 14px;border-radius:11px;
  background:rgba(168,122,200,.08);border:1px dashed rgba(168,122,200,.4);
  font-size:12.5px;color:#b39ad0;line-height:1.9;font-style:italic;
}

/* ---------- 结局收藏 ---------- */
.endgal{
  padding:12px 14px;border-radius:11px;border:1px solid var(--line2);
  background:rgba(0,0,0,.22);margin-bottom:9px;
}
.endgal.got{border-color:var(--gold);background:rgba(212,175,55,.07)}
.endgal .e1{font-size:14px;color:#5d584b;letter-spacing:.08em}
.endgal.got .e1{color:var(--gold2)}
.endgal .e2{font-size:11.5px;color:#4a463c;margin-top:4px;line-height:1.7}
.endgal.got .e2{color:var(--dim)}
</style>
</head>

<script>

const ACHIEVEMENTS = [

{

         res:'你挥手让所有人跟上。一百九十个人跪在同一道山脊上，哭喊、唱歌、举旗。场面宏大得足够写进奏章。<br><br>但「第一个」这个词，从此变成了一百九十份。史官花了三年，才勉强把主次重新分清。'},
        {text:'先派三人侦察，确认后再动身', eff:{R:12,C:-8},
         res:'你挑了三个最壮的印第安向导前出探路。三天后他们回来：确有大海。<br><br>等你亲自站上去时，雨季已经来了。热病在队伍里蔓延，死掉二十人。<br><br>谨慎保住了你的命，却把「第一」让给了时间。'}
      ]
    },
    {
      time:'1513年9月29日 · 海边', title:'战利品与眼睛',
      text:'你站在没膝的潮水里，举着剑和旗，以西班牙国王的名义「占有」了这片南海。夜里，营地里的窃窃私语压不住了：酋长献上的珍珠该进谁的口袋？谁该分多少金子？<br><br>你的副手皮萨罗——那个日后征服印加的人——正靠在火堆边，一句话不说地看着你。',
      rhyme:'分赃的那一刻，征服者就变成了掠夺者。',
      choices:[
        {text:'当场公开分配，自己只取一份', eff:{R:10,C:4},
         res:'你让人把战利品摊在沙滩上，一件件过秤、记账、当众点清。士兵们服了。<br><br>皮萨罗却没服——因为账本上没有他的名字。你赢得了人心，也赢得了一个终身的敌人。'},
        {text:'把最好的珍珠封存，遣船献给国王', eff:{R:6,F:8},
         res:'你把最大的一颗珍珠装进锦盒，附上奏章，派最快的船送回马德里。<br><br>国王记住了你的名字，也同步记下了一笔：未经许可，擅自远征。<br><br>荣誉和罪名，搭乘同一条船抵达。'},
        {text:'私下把最好的几颗留下，其余分给老兵', eff:{C:6,R:-8}, flag:'greedy',
         res:'你悄悄把几颗最好的塞进怀里。当天没人吭声。<br><br>但皮萨罗看见了。三个月后，一份匿名控诉状摆上了达连总督的案头。<br><br>你留下的不是珍珠，是一张死罪的凭据。'}
      ]
    },
    {
      time:'1517年 · 达连', title:'信封里的刀',
      text:'新总督佩德拉里亚斯到了。他带着国王的任命状，也带着对你的猜忌。他送来一封信，语气温和：请到阿克拉来，共商远征秘鲁之事。<br><br>老部下送你到渡口，压着嗓子说：那是陷阱。你手里还有一条船、两百个愿意跟你走的人。',
      rhyme:'最锋利的刀，往往装在信封里。',
      choices:[
        {text:'应邀赴约，以身入局', eff:{F:15,C:-10}, flag:'went',
         res:'你去了。佩德拉里亚斯穿着礼服在城门口迎你，握着你的手，笑得像个老朋友。<br><br>四天后，你被押上断头台，罪名是叛乱。你向行刑官讨来纸笔，想写最后一封信——没写完。'},
        {text:'烧掉信，连夜带人出海自行远征', eff:{C:15,F:-8}, flag:'refused',
         res:'你把信扔进火里，当晚扬帆。你在海上漂了几个月，被风浪逼回海岸，最后被自己的部下捆起来，送到了总督面前。<br><br>你死在自己人手里。但闭眼之前，你一直在看南边——那片海，你已经见过了。'},
        {text:'赴约之前，把发现经过誊抄三份分送三方', eff:{R:14,C:2}, flag:'copies',
         res:'你让三个抄写员同时落笔：一份面呈总督，一份随船送回马德里，一份交给教会。<br><br>你赴约，你被捕，你上了断头台——但送回马德里的那份报告活了下来。<br><br>四年后，皮萨罗沿着你写下的一百三十个地名，走进了印加。'}
      ]
    }
  ],
  otherSide:{who:'弗朗西斯科·皮萨罗', title:'跟在后面的人',
    text:'他站在人群里，看着巴尔沃亚拨开蕨叶，成为那个「第一个」。他记住了这一幕，也记住了那一刻自己心里的滋味。十四年后，他在秘鲁把印加皇帝关进一间屋子，让人往里填满黄金。他一生都在做同一件事：跟在一个人的后面，然后超过他。'},
  star:{name:'先见星', line:'你是第一个看见那片海的人。'},
  ending:{
    history:'真实历史：巴尔沃亚于 1513 年 9 月 25 日越过巴拿马地峡，成为第一个看见太平洋的欧洲人。1519 年，他被新任总督佩德拉里亚斯以叛乱罪处死，年约 44 岁。发现者死在通往自己发现的路上，至死没能走到秘鲁。',
    voices:{
      C:'你一生只相信冲上去——冲上山顶、冲进丛林、冲向那扇门。勇气让你看见了那片海，也让你看不见身后的刀。',
      R:'你算得清潮汐、账目和航线，却算不清人。你把每份报告都写得滴水不漏，唯独漏掉一件事：有些人杀人，不需要证据。',
      F:'你被时代随手捡起来，又被时代随手丢掉。你看见了新世界，却没走进它。你就是那个被历史借去用了一次的人。'
    }
  }
},
{
  id:2, key:'byzantium', title:'拜占庭的陷落', year:'1453',
  meta:'1453年5月29日 · 君士坦丁堡',
  role:'守城的将军', sigil:'gate', accent:'#7c5cbf',
  rounds:[
    {
      time:'1453年5月29日 · 凌晨两点', title:'一扇忘记关上的门',
      text:'君士坦丁堡已被围五十三天。你是城中最后的守将之一。昨夜，圣索菲亚大教堂的钟声破天荒地响了——东西两教会联合的弥撒，全城人挤在一处祈祷。<br><br>黎明前，巡逻兵跌跌撞撞闯进指挥所，脸白得像纸：<b>凯尔卡门</b>——内城与外城之间那扇平时只走杂役的小边门——竟然大开着。奥斯曼人正从那里鱼贯而入。',
      rhyme:'历史往往不是被大炮攻破的，而是被一扇忘记关上的小门。',
      choices:[
        {text:'亲自带卫队冲向凯尔卡门堵口', eff:{C:14,F:-5}, flag:'gate',
         res:'你提着剑奔向那扇门。门堵住了——但敌军已经从侧翼翻上了主城墙。<br><br>你死在离那扇门三十步的地方。城破之后，没有人记得你的名字，只记得那扇忘了关的门。'},
        {text:'放弃外城，把最后兵力集中到主城墙', eff:{R:9,C:5},
         res:'你判断主城墙才是真正的要害，把最后一支卫队全部压了上去。<br><br>你判断对了方向，却漏掉了那扇门。黄昏，城破。你战死在圣索菲亚前的广场上。<br><br>一千一百二十三年的罗马，在这一夜熄灭。'},
        {text:'换上平民长袍，从海路突围', eff:{C:-12,F:10}, flag:'escape',
         res:'你脱下铠甲，换上希腊商人的长袍，趁乱登上一条热那亚商船。<br><br>你活了下来。在意大利某个小城里，你用余生一遍遍写你如何失去了君士坦丁堡。<br><br>活下来的人写历史，死去的人成为历史。'}
      ]
    },
    {
      time:'1453年5月29日 · 破晓', title:'圣索菲亚的最后一课',
      text:'外城的喊杀声已经听得见。粮食见底，威尼斯与热那亚的援军始终没来。城里有人开始低声议论投降——用一座城，换几万条命。<br><br>皇帝脱下紫袍，站到圣索菲亚的中央。所有人都在看你。',
      rhyme:'一座城的结局，常常写在一夜之间的几句话里。',
      choices:[
        {text:'颁布最后的演说：城可破，名不可辱', eff:{C:12,R:-4}, flag:'speech',
         res:'你站上讲坛，说：我们不是在守卫一座城，我们在守卫一千一百年的东西。<br><br>全场跪下。第二天，没有一个人投降。他们只是全部战死了。<br><br>你给了他们尊严，也给了他们一具不用选择的尸体。'},
        {text:'公开谈判，用赔款换取妇孺出城', eff:{R:12,C:-6}, flag:'treaty',
         res:'你派人出城谈判，用城中最后的财富换一条通道。<br><br>苏丹同意了——但在最后关头，奥斯曼士兵还是冲进了队伍。<br><br>你救下了一部分人，也让守军最后的斗志塌了一半。'},
        {text:'沉默，独自跪在圣像前祈祷', eff:{F:12,R:3},
         res:'你一句话没说，跪在圣像前，直到天亮。<br><br>士兵们看着你跪着，也一个个跪下了。没有演说，没有号令。<br><br>那晚的静默，比任何演讲都更像一个时代的葬礼。'}
      ]
    },
    {
      time:'1453年5月29日 · 午后', title:'城墙之上',
      text:'城墙已破。你脱下皇袍，拔出剑。身边只剩几十个亲兵，和一地碎砖。<br><br>有人在喊你的名字，有人在喊圣母。也有人已经转身，往城门的方向跑。',
      rhyme:'一个罗马皇帝的最后一分钟，没有元老院，只有剑。',
      choices:[
        {text:'冲入敌阵，战死', eff:{C:16,F:4}, flag:'die',
         res:'你冲进了人群。没有人看清你是怎么倒下的。<br><br>你的尸体从未被认出来。<br><br>但从那天起，你成了「最后一个罗马皇帝」——不是因为你的政绩，是因为你选择死在自己城门口。'},
        {text:'组织残部撤退，图谋来日复国', eff:{R:12,F:-6}, flag:'retreat',
         res:'你收拢残兵，从海路退往摩里亚。<br><br>你在那里又活了几年，一直在写信、求援、筹钱。没有人再应你的信。<br><br>复国的计划没有失败——它只是从来没有开始过。'},
        {text:'放下剑，等待被俘后的命运', eff:{F:14,C:-8}, flag:'captive',
         res:'你把剑插进土里，站直了身子。<br><br>奥斯曼士兵涌上来时，有人认出了你，有人没有。你被带走了，从此在史书里只剩一行注脚。<br><br>你活过了那一天。那一天之后，你就不再是皇帝了。'}
      ]
    }
  ],
  otherSide:{who:'苏丹穆罕默德二世', title:'另一边的帐篷',
    text:'他二十一岁，在城外帐篷里已经等了五十三天。他的巨炮能轰塌城墙，但士兵一次次被城墙上的人打回来。那天凌晨，他听说内城有一扇小门没关。他没有立刻相信——这种运气从来不属于攻城的人。但他还是派了人去看。'},
  star:{name:'孤城星', line:'你守住了一座必失的城。'},
  ending:{
    history:'真实历史：1453 年 5 月 29 日，奥斯曼军队攻陷君士坦丁堡。据传内城的小门凯尔卡门因疏忽未关，成为突破口。皇帝君士坦丁十一世脱下皇袍冲入敌阵战死，尸体未被辨认。延续 1123 年的东罗马帝国就此终结，这一天常被视为中世纪的终点。',
    voices:{
      C:'你选了最没有胜算的那条路，并且走完了它。城还是破了，但你让「破」这个字，有了重量。',
      R:'你把每一块砖都算过了，也算出了结论：这是一场算不赢的仗。你只是把失败推迟了几个小时——而那几个小时，是几万人的命。',
      F:'你站在一整段历史的末尾。那不是你的错，却是你的命。有些人被派来赢，有些人被派来送别。'
    }
  }
},
{
  id:3, key:'handel', title:'亨德尔的复活', year:'1741',
  meta:'1737—1742年 · 伦敦',
  role:'乔治·弗里德里希·亨德尔', sigil:'note', accent:'#c9a227',
  rounds:[
    {
      time:'1737年 · 深夜', title:'一只不能动的手',
      text:'你是亨德尔。六周前的一次中风，让你的右半身彻底瘫痪。医生私下对人说：他也许还能说话，但永远不能再作曲了。<br><br>你的出版商破产，你的歌剧被观众抛弃，宫廷里的仇敌正在举杯。今天深夜，你坐在桌前，面前是一叠空白乐谱，窗外是阴雨绵绵的伦敦。',
      rhyme:'人最强壮的时刻，不是他胜利时，而是他从废墟里站起来时。',
      choices:[
        {text:'每天逼自己练习，直到手指能动', eff:{C:14,F:-4}, flag:'force',
         res:'你把右手按在琴键上，一遍、十遍、一百遍，直到痛得冒冷汗。仆人说你像在跟自己的身体打架。<br><br>六个月后，手指真的动了。<br><br>你不是被治好的，你是把自己打服的。'},
        {text:'去亚琛泡温泉，等待身体自己恢复', eff:{F:10,R:4}, flag:'spa',
         res:'你渡回莱茵河畔，在亚琛的温泉里泡了三个月。<br><br>手确实恢复了。你回到伦敦，重新开始作曲——但那股被死亡逼出来的、火山一样的力量，再也没有回来过。<br><br>痊愈和复活，不是一回事。'},
        {text:'接受现实，靠退休金安静地活下去', eff:{R:10,C:-9}, flag:'rest',
         res:'你放下了笔，开始种花、读诗、招待朋友。<br><br>你又活了十九年。十九年里，你没有再写下一个音符。<br><br>活着，和活着，是不一样的。'}
      ]
    },
    {
      time:'1741年8月22日 · 清晨', title:'一个陌生人寄来的包裹',
      text:'一个包裹送到你手上，没有署名。里面是詹宁斯辑录的《圣经》经文，标题是两个字：<b>弥赛亚</b>。<br><br>你翻开第一页，读到：「Comfort ye, comfort ye my people.」（安慰你们，安慰我的百姓。）<br><br>你的手停在纸上。窗外的伦敦正在下雨。',
      rhyme:'有些文字，是专门写给正在下沉的人的。',
      choices:[
        {text:'立刻动笔，不眠不休', eff:{C:14,R:-3}, flag:'instantly',
         res:'你当天就坐到了谱纸前。你不知道哪里来的力气。<br><br>从八月二十二日到九月十四日，二十四天。你几乎没有离开那张桌子。'},
        {text:'先读完所有经文，再决定写不写', eff:{R:12,C:3},
         res:'你把整本册子从头读到尾，做了标记，排了次序。<br><br>你用了三天。三天后你才动笔，但每一个音符落地时，你都已经知道它要去哪里。<br><br>慢三天，快一生。'},
        {text:'写信给朋友，问自己还配不配拿起笔', eff:{F:8,R:5},
         res:'你写了一封长信给老友，问他：一个瘫痪过半的人，还有资格写神的音乐吗？<br><br>朋友回信只有一句：不是你有资格，是这件事需要你。<br><br>你把信折好，放进了谱纸的第一页里。'}
      ]
    },
    {
      time:'1741年9月 · 二十四天', title:'门缝里的光',
      text:'你把自己关在房间里，二十四天。仆人说，他每天从门缝看进去，都看见你伏在谱纸上，一边写一边流泪。<br><br>你几乎不吃，也不睡。《哈利路亚》合唱写到最后一句时，你站起身，泪流满面地说：「我想我看见了天堂。」<br><br>现在是第二十三天的深夜。桌上有半块凉面包，和还没写完的第二部。',
      rhyme:'伟大不是被灵感砸中的，是被一个人用二十四天熬出来的。',
      choices:[
        {text:'继续。天亮前必须写完', eff:{C:15,F:-5}, flag:'nosleep',
         res:'你写到天亮。手指僵得握不住笔，就用左手按住右手。<br><br>九月十四日，全曲完成，共二百六十三页。<br><br>手稿上至今能看到被泪水晕开的墨迹。'},
        {text:'停下来睡四小时，再继续', eff:{R:11,C:3},
         res:'你放下笔，睡了过去。醒来时天已大亮。<br><br>你补完了剩下的部分，多用了五天。<br><br>没有人能说清，那五天里少掉的，是几个音符，还是别的什么。'},
        {text:'让仆人念经文给你听，边听边写', eff:{R:8,F:6},
         res:'你让仆人坐在旁边念。你闭着眼听，手指在桌上敲。<br><br>写到「他必将牧养自己的羊群」时，你突然睁眼，一口气写下整段。<br><br>你借了别人的声音，写成了自己的神。'}
      ]
    }
  ],
  otherSide:{who:'查尔斯·詹宁斯', title:'寄出歌词的人',
    text:'他只是把《圣经》里关于弥赛亚的经文抄了一遍，按时寄给一个落魄的老作曲家。他做这件事时并不知道自己在做什么。很多年后有人问他：您怎么想起来编这本歌词的？他说：我只是把书里的句子，按顺序排了排。'},
  star:{name:'复活星', line:'你从废墟里站了起来。'},
  ending:{
    history:'真实历史：亨德尔 1737 年中风偏瘫，后奇迹般恢复。1741 年 8 月 22 日至 9 月 14 日，他仅用 24 天完成清唱剧《弥赛亚》。1742 年都柏林首演大获成功，他把全部收入捐给慈善机构。此后每年指挥《弥赛亚》为孤儿院募捐，直到去世。1759 年葬于威斯敏斯特教堂。',
    voices:{
      C:'你没有等身体好起来，你是逼它好起来的。二十四天不是天赋的证明，是你跟自己打的最后一仗。',
      R:'你先读完了全部经文，才落第一个音。你的伟大不来自闪电，来自图纸。',
      F:'你在最不该被眷顾的时候被眷顾了。你以为是你在写，其实是那段文字，等了你很多年。'
    }
  }
},
{
  id:4, key:'marseillaise', title:'一夜天才', year:'1792',
  meta:'1792年4月25日 · 斯特拉斯堡',
  role:'鲁日·德·李尔', sigil:'flag', accent:'#d4574a',
  rounds:[
    {
      time:'1792年4月25日 · 凌晨三点', title:'被历史借用的笔',
      text:'你是鲁日·德·李尔，一个普通的工兵上尉。会写点诗，会弹吉他，但从没被人叫作作曲家。<br><br>昨夜，市长迪特里希在宴席上叹气：法国正被奥地利和普鲁士围攻，我们缺一首能让新兵唱着走上前线的歌。<br><br>现在是凌晨三点。你面前有一瓶酒、一把吉他和一张白纸。窗外是斯特拉斯堡的夜。',
      rhyme:'有些夜晚，普通人会被历史借去一次笔。',
      choices:[
        {text:'当夜就写，写出来为止', eff:{F:15,C:6}, flag:'write',
         res:'你半醉半醒地在吉他上拨出几个和弦。词一句一句涌出来——「前进，祖国的儿女们！」<br><br>天亮时，《莱茵军战歌》写完了。两个月后，马赛的志愿兵唱着它一路走进巴黎。从此它叫<b>《马赛曲》</b>。<br><br>你本人此后一生默默无闻，1836 年在穷困中死去。那一夜借给你的笔，再也没还回来。'},
        {text:'婉拒市长：我不是作曲家', eff:{R:10,C:-6}, flag:'decline',
         res:'你第二天去找市长，坦白说自己写不出来。<br><br>那首歌没有诞生。革命军在前线唱着别的、更普通的歌。<br><br>历史少了一首国歌，多了一个诚实的人。'},
        {text:'接下来，但先请朋友听一遍再定稿', eff:{R:9,F:6},
         res:'你把初稿唱给两个朋友听。他们听得手抖，说：这就是我们要的。<br><br>歌流传了，但传抄的乐谱上，署名那一栏是空的。<br><br>你亲手把自己的名字，从这首歌里拿掉了。'}
      ]
    },
    {
      time:'1792年6月 · 马赛', title:'合唱里的人',
      text:'歌火了。马赛的志愿兵唱着它进城，巴黎人跟着唱，街头巷尾都在唱。连敌人都知道这一首歌。<br><br>但没有人知道作者是谁——乐谱在传抄中被一次次抄丢。你有两个身份：一个默默无闻的军官，和一个写出了法国国歌的人。',
      rhyme:'一首歌越响，写它的人就越容易被淹没在合唱里。',
      choices:[

         res:'你向报社投书，附上初稿，证明自己是作者。<br><br>报上登了一小块。有人在酒馆里说：这人不配。<br><br>你争到了名字，也争到了一身麻烦。'},
        {text:'保持沉默，让这首歌属于所有人', eff:{F:12,C:4}, flag:'silent',
         res:'你什么也没说。你在军营里，看着士兵们唱着你写的词，一个个上了前线。<br><br>你写的东西变成了千万人的东西。这大概是诗人能拿到的最高报酬。<br><br>也是最沉默的一种。'},
        {text:'给出版商写信，索要应得的稿费', eff:{R:10,C:-8}, flag:'money',
         res:'你写信给出版商，要求结算。对方回信说：这种街头小调，没有稿费。<br><br>你把信收好，没再提。<br><br>事实证明，你确实没从中拿到过一个苏。'}
      ]
    },
    {
      time:'1820年代 · 巴黎的阁楼', title:'第二首马赛曲',
      text:'你出狱了，也彻底被忘了。你的名字不在任何一张作曲家名单上。你住在阁楼里，靠写诗和零星的稿费活着。街上偶尔还能听见《马赛曲》——拿破仑的军队曾唱着它横扫欧洲，现在它变成了另一种东西。<br><br>有个出版商找上门，说愿意付钱，请你再写「另一首马赛曲」。',
      rhyme:'历史只需要你一夜，剩下的日子，都得你自己过。',
      choices:[
        {text:'拒绝。一首就够了', eff:{C:11,F:6}, flag:'refuse2',
         res:'你说：一首就够了。再写，只是在模仿自己。<br><br>你继续写诗、译诗、教书，没人读。1836 年 6 月，你死在巴黎近郊的穷困里。<br><br>一百年后，法国政府把你的遗骨迁进了荣军院。'},
        {text:'答应，写了十几首，全都是石沉大海', eff:{R:-6,F:9}, flag:'again',
         res:'你写了十几首。没有一首被记住。<br><br>你把它们钉成一册，扉页上写着：《马赛曲》作者的其他作品。<br><br>没有人翻开过。'},
        {text:'搬到乡下，安静地老去', eff:{R:12,C:-4}, flag:'country',
         res:'你搬到乡下，种一点地，给学生上音乐课。<br><br>你活得比很多革命者都久。<br><br>但每年 7 月 14 日街上响起那首歌时，你都会把窗户关上。'}
      ]
    }
  ],
  otherSide:{who:'一个马赛志愿兵', title:'走在队伍里的人',
    text:'他不知道这首歌是谁写的。他只知道，从马赛走到巴黎的二十七天里，他们每天唱它。唱到后来歌词已经不重要了——重要的是唱着它的时候，人不怕死了。'},
  star:{name:'诞生星', line:'你在一个通宵里，写出了一个国家的嗓子。'},
  ending:{
    history:'真实历史：1792 年 4 月 25 日夜，鲁日·德·李尔在斯特拉斯堡一夜写成《莱茵军战歌》，后更名《马赛曲》，1795 年被定为法国国歌。他本人因贵族出身与政治立场多次被捕、革职，长期贫困，1836 年 6 月 26 日死于巴黎近郊。1915 年，他的遗骨被迁入巴黎荣军院。',
    voices:{
      C:'你写下的那句「前进」，后来成了整个国家喊出来的话。而你自己，一句都没有多喊。',
      R:'你懂得什么时候该退场。这让你活得比很多人久，也让你在史书里只剩下一个夜晚。',
      F:'历史借你的笔用了一个通宵，然后再也没来找过你。你不是天才，你是天才的过路人。'
    }
  }
},
{
  id:5, key:'waterloo', title:'滑铁卢的一分钟', year:'1815',
  meta:'1815年6月18日 · 圣让山',
  role:'格鲁希元帅', sigil:'sword', accent:'#8a6d3b',
  rounds:[
    {
      time:'1815年6月18日 · 上午十一点', title:'像闷雷一样的炮声',
      text:'你是格鲁希，拿破仑最后一任元帅。你奉命带三万三千人去追击「正在溃逃」的普鲁士人。<br><br>上午十一点，圣让山方向传来第一声炮响。起初零星，后来连成一片——像闷雷贴着地面滚过来。副将热拉尔跳下马：「将军，那是皇帝在决战！」<br><br>你手里攥着拿破仑四小时前给你的命令书：追击普鲁士人。',
      rhyme:'在历史的关键一分钟，服从和违抗，都会改变世界。',
      choices:[
        {text:'服从书面命令，继续东进', eff:{R:13,C:-11,F:-4}, flag:'obey',
         res:'你说：没有命令，我不能把部队带离战场。<br><br>你继续向东。傍晚，信使奔来：拿破仑在圣让山全线崩溃。<br><br>你离主战场只有三小时行军——但你一分钟都没回头。'},
        {text:'当场违令，全军转向炮声', eff:{C:16,R:-6}, flag:'rebel',
         res:'你一咬牙：「全体右转，向炮声前进！」<br><br>你的纵队像一把尖刀插进英军侧翼。滑铁卢的结局可能就此改写——但你，将以「违令」被送上军事法庭。<br><br>历史没有如果。但那一分钟，确实曾有过另一种欧洲。'},
        {text:'派侦察骑兵前出，同时等待新命令', eff:{R:9,F:5},
         res:'你派人前出探查，自己按住不动，等皇帝的新命令。<br><br>侦察兵回来时，天已经黑了。新命令始终没有来。<br><br>你做了最稳妥的事，也做了最没用的事。'},
        {text:'登上教堂钟楼，用望远镜看清那片山坡',
         eff:{R:10,C:7},
         rift:{id:1, name:'钟楼星', cond:s=>s.attrs.R>=62,
               note:'镜筒里看得见的东西，命令书上是没有的。'},
         res:'你爬上村口教堂的钟楼，借来一副望远镜。<br><br>镜筒里，英军和法军的军旗缠在同一面斜坡上，炮烟一层一层往上叠——那不是追击，那是会战。<br><br>你合上望远镜，第一次开始怀疑手里这张纸。<br><br><span style="color:#a87ac8">（星轨裂缝 · 你看见了茨威格没有写下的那一眼。）</span>'}
      ]
    },
    {
      time:'1815年6月18日 · 下午一点', title:'一个师的请求',
      text:'侦察兵带回消息：圣让山一线，法军正与英军死战，双方都到了极限。<br><br>热拉尔再次跳下马，几乎是吼出来的：「至少让我带一个师去！将军，这是命令之外的命令！」<br><br>参谋们围成一圈。有人低头，有人握拳。有人小声说：如果我们不去，明天我们就都是历史的罪人。',
      rhyme:'一支军队的命运，有时取决于一个人说不说「不」。',
      choices:[
        {text:'严令全军，不得擅动', eff:{R:13,C:-10}, flag:'strict',
         res:'你把命令重复了一遍：任何人不许离队。<br><br>热拉尔摔了帽子，转身走了。<br><br>你保住了部队的完整，也保住了自己「从不犯错」的名声——直到第二天。'},
        {text:'批准热拉尔带一个师回援', eff:{C:9,R:2,F:2}, flag:'onepiece',
         res:'你沉默了很久，说：带一个师，去。<br><br>那个师赶到时，拿破仑已经在撤退。他们没能逆转战局，但救下了几万溃兵。<br><br>你只派出了三分之一的人，却替自己留下了一条后路。'},
        {text:'召开军议，让参谋们集体表决', eff:{R:7,C:-6,F:9}, flag:'council',
         res:'你把所有旅长叫来，围坐一圈，让每个人说。<br><br>会开了四十分钟。最后决议是：再等等。<br><br>等到什么时候？没人说。<br><br>你把决定权分给了所有人，也就是把责任分给了所有人。'}
      ]
    },
    {
      time:'1815年6月18日 · 傍晚七点', title:'突然的安静',
      text:'炮声突然停了。<br><br>四点半的时候，它还密得像暴雨；五点以后渐渐稀了；到七点，整片原野安静得能听见虫叫。没有人知道圣让山上发生了什么。你派出的传令兵，一个都没回来。<br><br>三万三千人站在暮色里，看着你。',
      rhyme:'世界上有些沉默，是一个时代正在翻页的声音。',
      choices:[
        {text:'赌一把，全军急行军回援', eff:{C:16,F:-6}, flag:'rush',
         res:'你下令全军掉头，放弃辎重，急行军。<br><br>你们走到半夜，遇上了溃退的人潮。<br><br>战争已经结束了七个小时。你赶到时，只赶上了收拾残局。'},
        {text:'原地扎营，稳住阵脚', eff:{R:11,C:-8}, flag:'camp',
         res:'你下令就地扎营，加强警戒。<br><br>第二天早上，你才知道皇帝已经不在了。<br><br>你的三万三千人，成了法国最后一支完整的部队——也成了一支没有主人的部队。'},
        {text:'继续执行原命令，追击普军', eff:{R:13,C:-10,F:-5}, flag:'chase',
         res:'你说：命令没有取消，任务继续。<br><br>你追上了几股掉队的普鲁士人，打了一场小胜仗。<br><br>战报写得很漂亮：击退敌军一部。<br><br>同一天，欧洲换了主人。'}
      ]
    }
  ],
  otherSide:{who:'拿破仑·波拿巴', title:'圣让山上的一分钟',
    text:'下午四点，他站在圣让山的斜坡上，用望远镜一遍遍扫向东北方。那里本应出现三万个法国人。他等了整整一个下午。天黑时有人问：陛下，格鲁希在哪里？他没有回答。他知道这个问题的答案，会比这场失败活得更久。'},
  star:{name:'忠诚星', line:'你把服从执行到了最后一秒。'},
  ending:{
    history:'真实历史：1815 年 6 月 18 日，格鲁希率 33000 人追击普军，始终未向滑铁卢炮声方向靠拢。当天傍晚拿破仑战败，法军主力覆灭，格鲁希所部一枪未发。战后他被缺席判处死刑，流亡美国，1832 年病逝于巴黎。茨威格在文中称他为「被一纸命令困住的人」。',
    voices:{
      C:'你违抗了命令。历史没有如果，但那一分钟，确实曾经存在过另一种欧洲。',
      R:'你把「服从」执行得无懈可击，把整场战争交给了程序——而程序不会打仗。',
      F:'你被放在了一个你承受不起的位置上。历史选中你，不是因为你行，是因为那一刻必须有个人站在那里。'

  }
},
{
  id:6, key:'goethe', title:'玛丽恩巴德哀歌', year:'1823',
  meta:'1823年 · 波希米亚玛丽恩巴德',
  role:'约翰·沃尔夫冈·冯·歌德', sigil:'quill', accent:'#a87ac8',
  rounds:[
    {
      time:'1823年7月 · 玛丽恩巴德', title:'一枚递出去的戒指',
      text:'你是七十四岁的歌德。欧洲最伟大的诗人，魏玛公国的枢密顾问，一生写下了这个民族几乎全部的青春期。<br><br>这个夏天，你在波希米亚的玛丽恩巴德疗养，遇见了十九岁的乌尔丽克·冯·莱维佐夫。十年前你见过她，那时她还是个孩子。现在她跳舞、大笑、把手臂递给你，唤你「歌德先生」。<br><br>昨天，你把一枚戒指交给宫廷侍从，托他向她的母亲提亲。',
      rhyme:'一个七十四岁的人若还相信爱，他要么是个傻瓜，要么是个神。',
      choices:[
        {text:'追上去，亲自把戒指递出去', eff:{C:14,F:6}, flag:'ring',
         res:'你亲自去了。你穿着礼服，把话说得很慢，很郑重。<br><br>她的母亲听完，沉默了一下，说：她太年轻了。<br><br>你鞠了一躬，退了出来。<br><br>你一生被无数人拒绝过——只有这一次，你觉得自己是真的老了。'},
        {text:'收回戒指，承认这是妄想', eff:{R:13,C:-8}, flag:'withdraw',
         res:'你连夜派人取回了戒指，附了一封短信，说自己一时糊涂。<br><br>第二天舞会上，你照常微笑、照常谈诗。<br><br>没有人看出破绽。只有你自己知道，那天晚上你在花园里站了多久。'},
        {text:'写信给老友，问自己是不是疯了', eff:{R:8,F:7},
         res:'你给策尔特写了一封长信，说你七十四岁了，还会为一个人失眠，是不是已经疯了。<br><br>他回信说：你写《浮士德》写了六十年，还差这一封信吗？<br><br>你把信读了三遍，然后继续写你的求婚信。'}
      ]
    },
    {
      time:'1823年8月 · 被婉拒之后', title:'她依然把手递给你',
      text:'答复来了。客气、体面、滴水不漏：乌尔丽克还太年轻，不适合这样的婚姻。<br><br>舞会上，她仍然把手递给你，仍然笑着叫你「歌德先生」，仿佛什么都没发生过。她的母亲站在不远处，看着你们。<br><br>门口的马车已经备好，随时可以送你回魏玛。',
      rhyme:'最残酷的拒绝，不是说不，而是让你继续留在原地。',
      choices:[
        {text:'立刻离开玛丽恩巴德，不再回头', eff:{C:13,R:3}, flag:'leave',
         res:'你第二天一早就走了。行李收拾得极快，几乎没有告别。<br><br>后来你终身再未返回波希米亚。<br><br>有些人活到七十四岁才学会一件事：走。<br><br>你的马车离开时，天还没亮。'},
        {text:'再留三天，把想说的话说完', eff:{F:13,C:-4}, flag:'stay',
         res:'你又留了三天。你陪她散步、听她弹琴、看她跳舞。<br><br>第三天傍晚，她说：先生，您要走了吗？<br><br>你说：是。<br><br>那三天你没有说出任何想说的话。你把它们全部带走了。'},
        {text:'当夜就走，一句话都不留', eff:{R:11,C:5,F:-4}, flag:'vanish',
         res:'你当夜就走了，不留字条，不再见任何人。<br><br>第二天她问起，所有人都说：歌德先生回魏玛了。<br><br>你像从没来过一样离开。这大概是你一生中最不像诗人的一次退场。'}
      ]
    },
    {
      time:'1823年9月5日 · 马车里', title:'在颠簸中写下的那一首',
      text:'马车沿着乡间道路往北走。清晨离开卡尔斯巴德，中午经过哈勒，傍晚停在一座小驿站。<br><br>你坐在车里，脑子里全是她跳舞的样子。你向车夫要来纸笔——你写了六十年的诗，但从来没有像此刻这样，非写不可。<br><br>笔在手里。马车在颠簸。',
      rhyme:'命运把一个人推进极致的痛里，往往是为了让他写出最后那首诗。',
      choices:[
        {text:'一口气写完，一字不改', eff:{C:14,F:7}, flag:'poem',
         res:'马蹄声一下一下敲着，你一句一句写下去。<br><br>从卡尔斯巴德一直写到魏玛，二十三节，一气呵成。<br><br>《玛丽恩巴德哀歌》完成了。你说：这是我内心状态的直接记录。<br><br>此后再没有波希米亚，只有《浮士德》第二部。'},
        {text:'写了几行，又撕掉', eff:{R:9,F:-5}, flag:'tear',
         res:'你写了几行，看了半天，撕掉了。又写，又撕。<br><br>到魏玛时，纸篓里全是碎片。<br><br>那些句子后来在别人的回忆录里出现，被记成「一位老诗人晚年的一段心事」。'},
        {text:'不写诗，写一封平静的信给自己', eff:{R:12,C:2}, flag:'letter',
         res:'你给自己写了一封信，落款是「一个人，在九月」<br><br>信里没有一句难过，只是把这三个月的天气、路况、她穿的衣服，一件一件记下来。<br><br>三年后重读，你才发现：这封信本身就是一首诗，只是当时你不肯承认。'},
        {text:'让车夫掉头，再回卡尔斯巴德看一眼',
         eff:{F:11,C:7},
         rift:{id:2, name:'回望星', cond:s=>s.attrs.F>=62,
               note:'那扇还亮着灯的窗户，是你自己推开的第二条星轨。'},
         res:'你让车夫掉头。马车在夜色里逆着灯走，蹄声一下一下敲在石板上。<br><br>天快亮时你们到了卡尔斯巴德。你没有下车，只是坐在车里，看着那扇还亮着灯的窗户。<br><br>很久以后你说：走吧。<br><br><span style="color:#a87ac8">（星轨裂缝 · 你走完了那趟车，茨威格只写了一半。）</span>'}
      ]
    }
  ],
  otherSide:{who:'乌尔丽克·冯·莱维佐夫', title:'十九岁的那个夏天',
    text:'她记得他讲故事的语调，记得他跳舞时有点吃力，记得母亲说「不可以」。很多年后她老了，有人问她：歌德先生真的向您求过婚吗？她只是笑，说：那是很久以前的事了，先生。'},
  star:{name:'哀歌星', line:'你在七十四岁，写出了二十岁才敢写的东西。'},
  ending:{
    history:'真实历史：1823 年，74 岁的歌德在玛丽恩巴德爱上 19 岁的乌尔丽克·冯·莱维佐夫，托人求婚被婉拒。同年 9 月 5 日，他在从卡尔斯巴德返回魏玛的马车上写下《玛丽恩巴德哀歌》，共 23 节。此后他终身未再返回波希米亚，转向完成《浮士德》第二部。他称这首诗是「内心状态的直接记录」。',
    voices:{
      C:'你七十多岁了，还敢去爱一个人，还敢承认被拒绝。你的伟大不在诗里，在这份不肯体面的倔强里。',
      R:'你及时放开了手。你算清了年纪、身份和将来，然后把它们写成一首诗，让所有算不清的人读了都疼。',
      F:'不是爱情找到了你，是命运需要一个老人被爱击中的样子——好让后来的人知道，这件事没有年纪。'
    }
  }
},

  role:'约翰·苏特尔', sigil:'coin', accent:'#d4af37',
  rounds:[
    {
      time:'1848年1月24日 · 清晨', title:'水渠里的几粒金屑',
      text:'你是瑞士移民约翰·苏特尔。你在刚割让给美国的这片荒原上建起了自己的农场，叫新赫尔维西亚。你雇了一个叫马歇尔的木匠，正在盖一座锯木厂。<br><br>今天清晨，马歇尔把你拉到一边，手在抖：「昨天夜里，我在水渠里发现了这个。」他摊开手掌——<b>几粒金色的碎屑</b>。<br><br>你心里咯噔一下：如果你公开这件事，你的农场、你的工人、你花四年建起来的一切，都会在几周内被踏平。',

        {text:'立刻公开，向全世界宣布这里有金矿', eff:{C:9,F:11}, flag:'announce',

        {text:'先自己小规模开采，看看成色', eff:{R:7,C:6},

      text:'消息漏了。先是你的工人夜里偷偷跑去水渠，然后是一传十、十传百。<br><br>三个月里，十万人涌进加利福尼亚。你的麦田被踩成泥地，你的牛被牵走，你的工人跑得一个不剩。你站在自己盖起来的房子前，看着陌生人从你家门口搬走东西。',

        {text:'承认结束，把判决书烧掉', eff:{R:13,C:-4}, flag:'burn',

  otherSide:{who:'詹姆斯·马歇尔', title:'第二个人',
    text:'金砂是他先看见的。他把这件事告诉了老板，从此所有人都说是苏特尔发现了黄金。他后来穷困潦倒，死在一间小屋里。他一遍遍对人说：是我先捡起来的。人们点头，然后走开。'},

  ending:{
    history:'真实历史：1848 年 1 月，苏特尔的木匠马歇尔在萨克拉门托河谷水渠中发现金砂，引发加州淘金热。苏特尔的农场被淘金者踏平，此后二十余年持续诉讼，1855 年一度胜诉获判大片土地，但判决被暴动与上诉推翻，最终贫病而死。茨威格称他为「世界上最富有的人，也是最穷的人」。',

    }
  }

{
  id:8, key:'dostoevsky', title:'英雄的瞬间', year:'1849',
  meta:'1849年12月22日 · 圣彼得堡谢苗诺夫校场',
  role:'陀思妥耶夫斯基', sigil:'cross', accent:'#5a9ac8',
  rounds:[
    {
      time:'1849年12月22日 · 清晨八点', title:'还有几秒',
      text:'你是二十八岁的陀思妥耶夫斯基。因为参加一个讨论空想社会主义的读书小组，你被沙皇判了死刑。<br><br>今天早晨，你和二十一个难友被押到谢苗诺夫校场。你们的眼睛被蒙上。你听见士兵举枪、拉栓的声音。前一排的人已经被绑到了柱子上。<br><br>你在心里飞快地数：还有几秒？',
      rhyme:'在死亡面前，一个人会在十秒里过完一生。',
      choices:[
        {text:'睁着眼，把这十秒看成一整本书', eff:{F:15,C:5}, flag:'openeyes',
         res:'你没有闭眼。你看着冬天的雪、灰色的天空、旁边发抖的难友。<br><br>在枪响前的最后一分钟，一名军官骑马奔来——沙皇的「特赦」到了。<br><br>你被改判流放西伯利亚四年。后来你把这十秒写进了《白痴》。'},
        {text:'闭上眼睛，祈祷', eff:{R:9,F:6}, flag:'pray',
         res:'你闭上眼，念主祷文。<br><br>你听见枪响——那是前一排的人。<br><br>马蹄声由远及近。缓刑。<br><br>你瘫在雪地里。<br><br>你没有看见死亡，但死亡看见了你。'},
        {text:'冲士兵大喊，让他们快点动手', eff:{C:13,F:-5}, flag:'shout',
         res:'你大喊：「动手！别磨蹭！」<br><br>士兵愣住了，军官也愣住了。<br><br>缓刑令到了。你被拖下去时，还在骂骂咧咧。<br><br>后来你写出的每一本书，都带着这种在枪口下练出来的、对一切的轻蔑。'}
      ]
    },
    {
      time:'1850年1月 · 通往西伯利亚的雪橇', title:'赦免之后',
      text:'死刑改为流放四年。你被押上雪橇。同行的还有一整个冬天、几千俄里，和一条你不知道通向哪里的路。<br><br>你身上只剩一本福音书，和一双被铁镣磨出血的手腕。<br><br>同行的人里，有人第一天就开始哭，有人开始骂，有人一句话不说。',

        {text:'放下一切，专心祈祷，只求活着', eff:{F:14,R:-4}, flag:'devout',
         res:'你把福音书翻烂了。<br><br>你在雪地里跪过、在牢房里跪过、在被鞭打之后跪过。<br><br>你活了下来。<br><br>你后来说：如果没有那四年，我不会知道人到底是什么。'},
        {text:'拒绝再想文学，学着做一个普通人', eff:{R:9,C:-8}, flag:'ordinary',

    {
      time:'1859年 · 彼得堡的编辑部', title:'你打算写什么',
      text:'四年苦役，四年兵营，十年之后，你才获准回到彼得堡。<br><br>你带回一个写满字的小本子，里面是囚犯的绰号、口头禅、咳血的声音。你身上有癫痫，有债，还有一种压不住的冲动。<br><br>编辑部的人问你：你打算写什么？',

        {text:'先写能赚钱的，把债还清', eff:{R:12,C:-7}, flag:'debt',

        {text:'什么也不写，先好好活几年', eff:{R:9,F:-6}, flag:'live',

      ]
    }
  ],
  otherSide:{who:'同刑场的一个难友', title:'站在旁边的人',
    text:'他站在他旁边，也被蒙着眼睛。他后来活了下来，从西伯利亚回到俄国，做一个普通的公务员。他一生写过很多信，每封都提到那一天：我旁边站着一个人，他一直在看天。我当时想，这个人是不是疯了。'},
  star:{name:'洞见星', line:'你在枪口前，看见了全部人生。'},
  ending:{
    history:'真实历史：1849 年 12 月 22 日，陀思妥耶夫斯基等二十一人被押赴谢苗诺夫校场执行死刑，在行刑前一刻改判苦役。他在西伯利亚服苦役四年、兵役四年，1859 年重返文坛，此后《死屋手记》《罪与罚》《白痴》《卡拉马佐夫兄弟》相继问世，被视为现代小说的重要奠基者。',

{

  rounds:[

      text:'你是赛勒斯·菲尔德，美国富商。你押上全部身家，要把一根电缆铺到三千公里外的大洋底部，让欧洲和美洲能在几分钟内对话。<br><br>这是第二次尝试。第一次，电缆在铺到一半时断了，沉进两千米深的海里，找了七天也没找到。<br><br>董事会在等你表态。账上还剩的钱，只够再试一次。',

         res:'你在报纸上刊了长文，把技术细节一条条列出来，说：是我错了。<br><br>公众的怒气反而消了。<br><br>几年后你再去筹资，有人主动找上门。<br><br>敢于认错的人，最后反而能拿到下一笔钱。'},
        {text:'再赌一次，公开宣布重建', eff:{C:16,F:5}, flag:'rebuild',
         res:'你在废墟上开了一场发布会，说：我们明年再来。<br><br>全场先是安静，然后有人鼓掌。<br><br>你的名声还是坏的，但从那天起，人们不再叫你骗子，叫你疯子。'},
        {text:'沉默退出，把余生交给别的事', eff:{R:12,C:-8}, flag:'quit',
         res:'你退出了公司，去做别的生意。<br><br>很多年后，有人在你书房里看到一卷电缆的样品，问你那是什么。<br><br>你说：一件我差点做成的事。'},
        {text:'跳上打捞船，亲手盯住最后一段接续',
         eff:{C:11,R:6},
         rift:{id:3, name:'同缆星', cond:s=>s.attrs.C>=68,
               note:'有些人不是站在岸上等结果，他们把自己也铺进去。'},
         res:'你跳上甲板，连续四十天没有离开绞盘。你亲手摸过每一米电缆。<br><br>工程师说：先生，您不该待在这里。<br><br>你说：我不是待在这里，我是待在这根线上。<br><br><span style="color:#a87ac8">（星轨裂缝 · 你把自己也铺进了海底。）</span>'}
      ]
    },
    {
      time:'1866年7月 · 「大东方号」出港', title:'第十一次',
      text:'八年过去了。你破产三次，被报纸骂过无数次，鬓角全白了。<br><br>今天，新的巨轮「大东方号」载着新的电缆驶出港口。这是第十一次尝试。海面上有风，船员们都在看你。<br><br>你手上攥着最后一批筹来的钱。这次再失败，就真的没有下一次了。',
      rhyme:'你失败了十一次，世界只允许你成功一次。',
      choices:[
        {text:'全程随船，亲手完成对接', eff:{C:16,F:6}, flag:'aboard',
         res:'你和船员一起在甲板上熬了三十天。<br><br>1866 年 7 月 27 日，电缆在纽芬兰上岸，信号清晰。<br><br>这一次它再没断过。<br><br>同年，你还把 1858 年沉掉的那一段，从两千米海底捞了上来。'},
        {text:'留在岸上等结果，避免干扰工程师', eff:{R:12,C:-4}, flag:'shore',
         res:'你在岸上等了三十天，每天守在电报房。<br><br>信号到了。<br><br>你还算克制，只是把手里的杯子放下来，说了句：好。<br><br>那年你五十岁，已经学会不跳起来了。'},
        {text:'把最后一笔钱全押上去，不留后路', eff:{C:13,F:9}, flag:'allin',
         res:'你把最后一分钱都投了进去，连房子都卖了。<br><br>成功了。<br><br>记者问你当时怕不怕。你说：怕，但我不需要留后路——因为如果这次失败，我也不打算再过别的日子了。'}
      ]
    }
  ],
  otherSide:{who:'船上的电缆工程师', title:'甲板下的三十天',
    text:'他不关心历史。他只关心绞盘转速、绝缘层有没有被划伤、海水的温度和电缆张力。船每沉下一米线，他的心跳就慢一点。后来人们把这件事称作「人类第一次跨洋通话」，他一直不太习惯这个说法。'},
  star:{name:'执着星', line:'你把自己也铺进了海底。'},
  ending:{
    history:'真实历史：赛勒斯·菲尔德自 1854 年起推动跨大西洋电报电缆。1857 年首次铺设失败，1858 年成功，维多利亚女王与美国总统互通电报，三周后电缆烧断。此后他持续筹资，1866 年新电缆成功铺通并长期运行，同年还打捞回 1858 年失落的那一段。电报从此把世界连成一体。',
    voices:{
      C:'你不是技术专家，你是那个不允许这件事失败的人。别人计算概率，你计算意志。',
      R:'你懂得暂停、道歉和重启。你的坚持里没有一次是盲目的。',
      F:'你被安排去撞一堵墙，撞了十一次，然后墙倒了。世界记住的是墙倒下的声音。'
    }
  }
},
{
  id:10, key:'tolstoy', title:'逃向苍天', year:'1910',
  meta:'1910年10月 · 亚斯纳亚·波良纳',
  role:'列夫·托尔斯泰', sigil:'train', accent:'#b0b0b0',
  rounds:[
    {
      time:'1910年10月28日 · 凌晨', title:'一只小皮箱',
      text:'你是八十二岁的托尔斯泰。你拥有全世界的名声、亚斯纳亚·波良纳的庄园、无数追随者。但你的妻子索尼娅每天翻你的日记、偷听你的每一句话，你们已经这样过了四十八年。<br><br>今夜，你从床上坐起来，点亮灯，收拾了一只小皮箱，叫醒了医生。<br><br>你写了一封给妻子的信，放在桌上。',
      rhyme:'八十二岁了，他还在出走。',
      choices:[
        {text:'出门，上马车，不再回头', eff:{C:15,F:5}, flag:'flee',
         res:'你摸黑穿过屋子，绕开会响的那块地板。<br><br>马车在夜色里走出去很远，你才允许自己回头看了一眼。<br><br>你后来说：那天晚上，我像小偷一样离开了自己的家。'},
        {text:'把信烧掉，回床上继续睡', eff:{R:13,C:-8}, flag:'stay',
         res:'你站在桌前很久，最后把信投进炉子。<br><br>第二天早上，索尼娅照常来问你睡得好不好。<br><br>你说很好。<br><br>三年里你每天都想走，三年里你每天都留下了——直到最后那一天。'},
        {text:'先叫醒女儿，让她陪你一起走', eff:{R:7,F:8}, flag:'daughter',
         res:'你叫醒了小女儿萨莎。她一句话没问，十五分钟内穿好衣服，收拾好东西。<br><br>两个人一起上了马车。<br><br>天亮时，亚斯纳亚·波良纳已经在十几俄里之外。'}
      ]
    },
    {
      time:'1910年10月31日 · 三等车厢', title:'没人认出他',
      text:'你坐在三等车厢里。没有头等包厢，没有随从，你和农民挤在一起，裹着毯子咳嗽。<br><br>邻座的人在讨论托尔斯泰写的小说。一个说：那个人虚伪，住着庄园写穷人。另一个说：不，那个人是我们这里唯一说真话的人。<br><br>他们没有认出你。车窗外是俄罗斯的原野，天黑得像泼了墨。',
      rhyme:'一个人可以逃出庄园，逃不出他写下的那些字。',
      choices:[
        {text:'继续走，去高加索，找一个真正的修道院', eff:{C:14,F:6}, flag:'caucasus',
         res:'你决定往南走。你想在那里租一间小屋，种菜、看云、等死。<br><br>你甚至已经想好了要写的那本书的名字。<br><br>你没走到高加索。你只走到了阿斯塔波沃。'},
        {text:'在下一站下车，先找个地方养病', eff:{R:11,C:-4}, flag:'rest',
         res:'你在阿斯塔波沃下了车。<br><br>站长认出了你，把那间小屋让给你，自己搬去了走廊。<br><br>你躺下来，接过一杯热茶，说：谢谢。<br><br>这是你一生中最后一句普通的客气话。'},
        {text:'掉头回去，去跟索尼娅把话说完', eff:{R:8,C:-9}, flag:'return',
         res:'你让萨莎去买返程的票。<br><br>车站在下雪，售票窗口关着。<br><br>你在站台上站了很久，然后蹲下来咳血。<br><br>命运替你取消了这趟车。'}
      ]
    },
    {
      time:'1910年11月7日 · 阿斯塔波沃小站', title:'门外的敲门声',
      text:'你发高烧，在阿斯塔波沃这个小站下了车。站长把自己那间小屋让给了你。<br><br>消息传出去了。全世界的记者正在赶来的路上。你的妻子索尼娅也上了火车。你的子女们在为「谁能见你最后一面」争吵。<br><br>你躺在窄床上，只剩医生在。门外有人在敲门。',
      rhyme:'他写了一辈子家庭，最后却在一个陌生人的屋顶下，一个人死去。',
      choices:[
        {text:'谁也不见，独自走完最后一段', eff:{C:12,R:6}, flag:'alone',
         res:'你让人把门守住。你说了最后几句话，都是关于该怎么活下去，不是关于怎么死。<br><br>索尼娅被拦在窗外。她隔着玻璃看了你很久。<br><br>你死于 11 月 7 日清晨六点零五分。<br><br>你的坟上，没有墓碑。'},
        {text:'让索尼娅进来', eff:{R:10,F:-5}, flag:'sonya',
         res:'她进来了。她跪在床边，握着你的手，一直哭。<br><br>你看着她，什么都没说，也没有把手抽回来。<br><br>四十八年的争吵，就这样结束了。<br><br>你想逃的那个人，最后陪你到了终点。'},
        {text:'让所有孩子和记者都进来，把话说清楚', eff:{C:10,F:8}, flag:'everyone',
         res:'你让人开了门。小屋里挤满了人，闪光灯亮个不停。<br><br>你用尽力气说了几句关于「不要暴力」的话。<br><br>第二天，全世界报纸的头版都是你在病床上的照片。<br><br>你连死，都没能安静地死。'}
      ]
    }
  ],
  otherSide:{who:'索菲亚·托尔斯泰', title:'窗外的那场雪',
    text:'她半夜醒来，发现身边是凉的，桌上少了一双靴子。她坐在那儿，直到天亮才开始发抖。四十八年里她抄了他所有的稿子，其中《战争与和平》抄了七遍。她后来对女儿说：他要的不是自由，他要的是让我成为那个「拦住他的人」。'},
  star:{name:'出走星', line:'你在八十二岁那年，还是走了。'},
  ending:{
    history:'真实历史：1910 年 10 月 28 日深夜，82 岁的托尔斯泰瞒着妻子离家出走。11 月 3 日他在阿斯塔波沃车站（今列夫·托尔斯泰站）因肺炎下车，11 月 7 日死于该站站长的小屋中。临终前他拒绝妻子索尼娅探视。他被葬在亚斯纳亚·波良纳的林中，没有墓碑，没有十字架。',
    voices:{
      C:'你在八十二岁那年，做了一件十八岁才敢做的事——把一切都丢下，只为不再撒谎。',
      R:'你走到一半就停下了。你算得出身体撑不住，也算得出她一定在找你。',
      F:'你想死在路上，命运让你死在半路。这大概是你一生中，最像你自己结局的结局。'
    }
  }
},
{
  id:11, key:'scott', title:'南极争夺战', year:'1912',
  meta:'1912年1月—3月 · 南极冰原',
  role:'罗伯特·斯科特', sigil:'snow', accent:'#7fb8d4',
  rounds:[
    {
      time:'1912年1月18日 · 南极点', title:'猎猎作响的挪威旗',
      text:'你是斯科特，英国皇家海军上校。你带着四个同伴，在冰原上走了七十一天。<br><br>今天，你们终于爬上最后一道冰脊——一面挪威国旗正在风里猎猎作响。阿蒙森比你们早到了三十五天。<br><br>你站在世界的尽头，手里攥着英国国旗。气温零下四十度。返程还有八百英里。',
      rhyme:'历史只给胜利者写传记，但失败者留下了最动人的日记。',
      choices:[
        {text:'插旗、拍照，坚持完成科学观测再走', eff:{R:12,F:6}, flag:'science',
         res:'你们插上英国国旗，在挪威旗旁边拍了一张照片，然后按计划完成气象和地质观测。<br><br>你们多花了三天，背回了十六公斤岩石标本。<br><br>那批标本后来证明南极洲曾与大陆相连。'},
        {text:'立刻掉头返程，一分钟也不多待', eff:{R:9,C:-6}, flag:'turnback',
         res:'你们拍完照就走。<br><br>你省下了三天。<br><br>三年后人们才知道：你省下的那三天，不够抵上后来的一场暴风雪。'},
        {text:'在极点停留一整天，把记录写完整', eff:{C:11,F:7}, flag:'record',
         res:'你在极点待了一整天，写完了日记的最后几页。<br><br>你写道：「上帝啊，这是一个可怕的地方。我们付出了这么大的代价，却得不到第一名的安慰。」<br><br>这句话后来印在了无数本书里。'}
      ]
    },
    {
      time:'1912年2月 · 罗斯冰架', title:'沉下去的日记本',
      text:'返程路上，你们发现预定的补给点位置偏了。煤油不足，食物不足。埃文斯在 2 月 17 日倒下，再也没有站起来。<br><br>剩下四个人，每天只能前进九英里。风速每小时七十公里。你们的手已经握不住笔了。<br><br>雪橇上还剩：十六公斤岩石标本，几本日记，和只够十天的煤油。',
      rhyme:'在南极，每多带一克纸，就少带一克煤油。',
      choices:[
        {text:'丢掉一切非必需品：标本、日记、多余的衣服', eff:{R:13,C:-6}, flag:'dump',
         res:'你们把标本一件件搬下雪橇，摆在雪地上，做上标记。<br><br>轻装之后你们确实走得快了些。<br><br>但没有快到能跑赢三月。'},
        {text:'把标本和日记都带上，哪怕因此慢下来', eff:{C:13,R:-5}, flag:'keep',
         res:'你们一件都没丢。<br><br>十六公斤岩石，压在已经快走不动的四个人身上。<br><br>八个月后，搜救队找到了它们——连同你们一起。'},
        {text:'抄近道，走那条没勘测过的路线', eff:{R:9,F:5}, flag:'shortcut',
         res:'你们偏离了原路线。三天后，你们在冰裂缝区前被迫停下，只能原路返回。<br><br>你损失了四天。<br><br>你在日记里写：我不该赌。'}
      ]
    },
    {
      time:'1912年3月17日 · 帐篷里', title:'我出去走走',
      text:'队员奥茨的双脚严重冻伤，已经走不动了。他一直在拖累队伍。<br><br>今天早晨，外面在刮暴风雪。奥茨从睡袋里坐起来，说：<br><br>「我出去走走，可能要多待一会儿。」<br><br>他爬出了帐篷，走进了风雪。没有人拦他。',
      rhyme:'有些人不是被风雪带走的，是自己走出去的。',
      choices:[
        {text:'追出去，把他背回来', eff:{C:14,F:-4}, flag:'catch',
         res:'你追了出去。你在二十米外追上他，把他背回帐篷。<br><br>你的手在那一刻冻伤了。<br><br>他多活了九天。你们三个，少活了几天。<br><br>你说：我从来没有后悔过那二十米。'},
        {text:'尊重他的选择，目送他离开', eff:{F:13,R:-4}, flag:'letgo',
         res:'你没有动。帐篷里安静了很久。<br><br>你在日记里写道：那是一个勇敢的人，一个英国绅士，他自愿走向死亡。<br><br>我们打算就这样走到终点——离补给站只有十一英里了。'},
        {text:'把最后的药和口粮分给剩下的人，继续前进', eff:{R:12,C:3}, flag:'moveon',
         res:'你们在帐篷里坐了一会儿，然后开始收拾。<br><br>没有人说话。<br><br>你们又往前走了二十英里，然后被一场持续十一天的暴风雪按住。<br><br>你们离下一个补给站，只有十一英里。'},
        {text:'翻开奥茨留在睡袋里的那一页日记',
         eff:{F:11,R:6},
         rift:{id:4, name:'同雪星', cond:s=>s.attrs.F>=66,
               note:'有些话没有人读，就永远不会被写进历史。'},
         res:'你翻开他留在睡袋里的笔记本。<br><br>最后一页写着：「我很高兴能这样结束。我希望我母亲知道，我走的时候是个英国人。」<br><br>你把那一页折好，塞进自己胸口的衣服里。<br><br><span style="color:#a87ac8">（星轨裂缝 · 你读到了历史没有保存下来的那句话。）</span>'}
      ]
    }
  ],
  otherSide:{who:'劳伦斯·奥茨', title:'走出去的那个人',
    text:'他知道自己拖慢了所有人。他没有告诉任何人他要走，因为那样他们一定会拦他。三十几岁，上尉，腿已经烂了。他在睡袋里写下最后那行字，然后拉开门帘——外面是零下四十度的风。他做得非常安静，像一个绅士离开一场聚会。'},
  star:{name:'尊严星', line:'你们输了比赛，赢了别的东西。'},
  ending:{
    history:'真实历史：1912 年 1 月 17 日，斯科特一行五人抵达南极点，发现阿蒙森已先到 35 天。返程中埃文斯于 2 月 17 日死去，奥茨于 3 月 17 日在暴风雪中走出帐篷，斯科特与威尔逊、鲍尔斯于 3 月 29 日死在帐篷里，距下一个补给站仅 11 英里。八个月后，搜救队找到遗体、日记和 16 公斤地质标本。',
    voices:{
      C:'你明知回不去，还是把标本和日记都背上了。你不是输给了南极，你是赢给了自己。',
      R:'你做了每一个正确的决定，然后每一个正确的决定都被天气否定了。',
      F:'你被选中去当那个第二名。没有你，阿蒙森的胜利不会显得那么完整。'
    }
  }
},
{
  id:12, key:'lenin', title:'封闭的列车', year:'1917',
  meta:'1917年4月 · 苏黎世—彼得格勒',
  role:'流亡者', sigil:'wheel', accent:'#c0392b',
  rounds:[
    {
      time:'1917年4月9日 · 苏黎世车站', title:'一列铅封的车厢',
      text:'你是一个流亡瑞士多年的俄国革命者。二月革命爆发了，沙皇倒台，但你回不去——俄国正被德国围着。<br><br>德国外交部递来一个提议：给你一列「封闭列车」，穿过德国、瑞典、芬兰，回俄国。条件是：你要在俄国鼓动士兵「单独媾和」，让德国从东线抽身。<br><br>这是一场交易。你心里非常清楚。瑞士的同志们站在站台门口，想劝你别上车。',
      rhyme:'有些人改变世界的方式，是冒一次最脏的险。',

function fateOf(id){ return FATES.find(f=>f.id===id) || null; }
/* 引力倍率统一入口：漂泊者不受引力削弱 */
function effMul(isReal, isRift){
  if(isReal || isRift) return 1;
  if(S.fate === 'wander') return 1;
  return gravMul(false);
}
function fateDeepCost(){ return S.fate==='oracle' ? 0 : DEEP_COST; }
function fateDeepSeconds(){ return DEEP_SECONDS + (S.fate==='oracle' ? 6 : 0); }
function applyFateDeltas(oldId, newId){
  const o = fateOf(oldId), n = fateOf(newId);
  if(o) for(const k of ['C','R','F']) S.attrs[k] = clamp(S.attrs[k] - (o.attrs[k]||0));
  if(n) for(const k of ['C','R','F']) S.attrs[k] = clamp(S.attrs[k] + (n.attrs[k]||0));
}

function realityPicks(){
  const {C,R,F} = S.attrs;
  const set = (C>=R && C>=F) ? [1,13,11]
            : (R>=C && R>=F) ? [5,9,14]
            : [8,10,12];
  const top = deviationTop();
  const out = [];
  if(top) out.push(top.id);
  set.forEach(id=>{ if(!out.includes(id)) out.push(id); });
  REALITY.forEach(r=>{ if(out.length < 3 && !out.includes(r.id)) out.push(r.id); });
  return out.slice(0,3);
}

function gravMul(isReal){
  if(isReal) return 1;
  if(S.pull >= 75) return 0.5;    // 历史收紧：偏离的代价更大
  if(S.pull <= 30) return 1.5;    // 历史松开：偏离更容易
  return 1;
}
function gravNote(){
  if(S.pull >= 88) return {cls:'tight', t:'历史在这个路口收紧了 —— 你想偏离，要付双倍的代价。'};
  if(S.pull >= 75) return {cls:'tight', t:'历史正在收紧，偏离的路越来越窄。'};
  if(S.pull <= 22) return {cls:'loose', t:'历史在这里松开了手 —— 你做什么，它都不再拦你。'};
  if(S.pull <= 30) return {cls:'loose', t:'你已经走出了史书的边界。'};
  return null;
}
/* 返回本轮真正「看得见」的选项 */
function visibleOf(){
  const ch = cur(), rd = ch.rounds[S.ri];
  const ri = realIdx(ch.id, S.ri);
  const out = []; let hid = 0;
  rd.choices.forEach((c,i)=>{
    if(c.rift){
      const probe = (S.fate==='shadow')
        ? {attrs:{C:S.attrs.C+8, R:S.attrs.R+8, F:S.attrs.F+8}} : S;
      if(!c.rift.cond(probe)) return;
      out.push({c, i, real:false});
      return;
    }
    const v = VISION[`${ch.id}-${S.ri}-${i}`];
    if(v){
      const val = S.attrs[v.attr];
      if(v.mode === 'require' && val <  v.v){ hid++; return; }
      if(v.mode === 'forbid'  && val >= v.v){ hid++; return; }
    }
    out.push({c, i, real: i === ri});
  });
  return {out, hid};
}

function drawFate(isReroll){
  if(isReroll){
    if(S.fateReroll <= 0 || S.seen.length > 0 || !S.fate) return;
    const pool = FATES.filter(f=>f.id!==S.fate);
    const nf = pool[Math.floor(Math.random()*pool.length)];
    applyFateDeltas(S.fate, nf.id);
    S.fate = nf.id; S.fateReroll = 0;
  } else {
    if(S.fate) return;
    const nf = FATES[Math.floor(Math.random()*FATES.length)];
    applyFateDeltas(null, nf.id);
    S.fate = nf.id; S.fateReroll = 1;
  }
  checkAch(); save(); renderShelf();
}

          <div class="ch-title">${ch.title}</div>

          <div class="round-pips">
            ${Array.from({length:total},(_,i)=>`<i class="${i<S.ri?'on':(i===S.ri?'now':'')}"></i>`).join('')}
          </div>
        </div>
      </div>

      ${mem ? `<div class="echo-mem">⟲ 上一世，你在这一轮选择了「<b>${mem.text}</b>」。这一次，你已经知道后面会发生什么。</div>` : ''}

      <div class="story">
        <div class="small" style="margin-bottom:10px;color:#8a7326">${rd.time}</div>
        <p style="color:#f6e9b0;font-size:16px;letter-spacing:.06em;margin-bottom:12px">${rd.title}</p>
        <p>${rd.text}</p>
        ${rd.rhyme ? `<span class="rhyme">${rd.rhyme}</span>` : ''}
      </div>

      <div class="timer-line">
        <span>第 ${S.ri+1} / ${total} 次抉择</span>
        <button class="deep" id="deepBtn" ${S.attrs.F < fateDeepCost()+3 ? 'disabled' : ''}>☾ 深思${fateDeepCost()>0 ? `（−${fateDeepCost()} 命运）` : '（命运默许）'}</button>
        <span id="tLab">剩余 15.0 秒</span>
      </div>
      <div class="timer-track"><div class="timer-fill" id="tFill"></div></div>

      <div class="choices" id="choices">
        ${VIS.map((o,i)=>{
          const c = o.c;
          let eff = '';
          if(c.eff){
            const mul = effMul(o.real, !!c.rift);
            const p = [];
            for(const k of ['C','R','F']){
              const raw = c.eff[k]||0;
              if(!raw) continue;
              let vv = raw;
              if(!o.real && raw > 0 && mul !== 1) vv = Math.max(1, Math.round(raw*mul));
              p.push(`<span class="${vv>0?'up':'dn'}">${ANAME[k]} ${vv>0?'+':''}${vv}</span>`);
            }
            if(p.length) eff = `<span class="eff">${p.join(' · ')}</span>`;
          }
          const ec = ECHOES[`${ch.id}-${S.ri}-${o.i}`];
          const echo = (ec && ec.need.every(f=>S.flags.includes(f)))
            ? `<span class="echo">${ec.text}</span>` : '';
          return `<button class="choice ${c.rift?'secret':''}" data-i="${i}" style="animation-delay:${i*45}ms">${c.text}${eff}${echo}</button>`;
        }).join('')}
      </div>
      ${gn ? `<div class="grav-note ${gn.cls}" style="margin-top:14px">${gn.t}</div>` : ''}
      ${cipherLine}
    </div>`;

  $('app').querySelectorAll('.choice').forEach(b=>{
    b.onclick = ()=> choose(Number(b.dataset.i), false);
  });
  $('deepBtn').onclick = ()=> deepThink();
  startTimer(false);
}

function startTimer(from){
  if(timer){ clearInterval(timer); timer = null; }
  const fill = $('tFill'), lab = $('tLab');
  if(!from){
    tLeft = FULL_ROUNDS;
    if(fill){ fill.style.width = '100%'; fill.classList.remove('warn'); }
  }
  timer = setInterval(()=>{
    tLeft -= 0.1;
    if(fill){
      fill.style.width = Math.max(0, tLeft/FULL_ROUNDS*100) + '%';
      if(tLeft <= 5) fill.classList.add('warn');
    }
    if(lab) lab.textContent = tLeft > 0 ? `剩余 ${tLeft.toFixed(1)} 秒` : '命运代你做出了选择…';
    if(tLeft <= 0){
      clearInterval(timer); timer = null;
      const pool = VIS.map((o,i)=>o.c.rift?-1:i).filter(i=>i>=0);
      choose(pool.length ? pool[Math.floor(Math.random()*pool.length)] : 0, true);
    }
  }, 100);
}
function stopTimer(){
  if(timer){ clearInterval(timer); timer = null; }
  if(deepTimer){ clearInterval(deepTimer); deepTimer = null; }
  deepLeft = 0;
}

/* 深思：让时间停住，代价是命运 */
function deepThink(){
  if(deepUsed || deepLeft > 0) return;
  const dc = fateDeepCost();
  if(S.attrs.F < dc + 3) return;
  deepUsed = true;
  S.deepCount++;
  if(dc > 0){ S.attrs.F = clamp(S.attrs.F - dc); refreshHUD([['F', -dc]]); }
  if(timer){ clearInterval(timer); timer = null; }
  const lab = $('tLab'), btn = $('deepBtn');
  if(btn){ btn.disabled = true; btn.textContent = '☾ 深 思 中'; }
  deepLeft = fateDeepSeconds();
  checkAch(); save();
  deepTimer = setInterval(()=>{
    deepLeft -= 0.1;
    if(lab) lab.textContent = `深思中 · 还剩 ${deepLeft.toFixed(1)} 秒`;
    if(deepLeft <= 0){
      clearInterval(deepTimer); deepTimer = null; deepLeft = 0;
      if(lab) lab.textContent = '深思结束 · 时间继续';
      startTimer(true);
    }
  }, 100);
}

function refreshHUD(gains){
  gains.forEach(([k,v])=>{
    const el = document.querySelector(`.hud-cell[data-k="${k}"]`);
    if(!el) return;
    el.classList.remove('up','down');
    void el.offsetWidth;
    el.classList.add(v>0?'up':'down');
    const vl = el.querySelector('.vl'); if(vl) vl.textContent = S.attrs[k];
    const bar = el.querySelector('.track i'); if(bar) bar.style.width = S.attrs[k]+'%';
  });
}

/* ============================================================
   抉择
   ============================================================ */
function choose(idx, timeout){
  stopTimer();
  const ch = cur(), rd = ch.rounds[S.ri];
  const o = VIS[idx];
  if(!o) return;
  const c = o.c, isReal = o.real;

  const usedT = Math.max(0, FULL_ROUNDS - Math.max(0, tLeft));
  S.times.push(usedT);
  if(timeout) S.timeouts++;
  if(!timeout && tLeft <= 1.5) S.lastSecond++;

  S.posHist.push(idx);
  const n = S.posHist.length;
  if(n>=3 && S.posHist[n-1]===S.posHist[n-2] && S.posHist[n-2]===S.posHist[n-3]) S.tripledSamePos = true;

  /* 属性增减（含引力倍率、饱和衰减） */
  const gains = [];
  if(c.eff){
    const mul = effMul(isReal, !!c.rift);
    for(const k of ['C','R','F']){
      const raw = c.eff[k]||0;
      if(!raw) continue;
      let v = raw;
      if(raw > 0){
        if(!isReal && !c.rift && mul !== 1) v = Math.max(1, Math.round(v*mul));
        if(S.attrs[k] >= 92) v = Math.max(1, Math.round(v*0.5));   // 接近饱和，收益减半
        if(S.fate==='dare'   && k==='C') v = Math.ceil(v*1.3);     // 星命·亡命者
        if(S.fate==='scribe' && k==='R') v = Math.ceil(v*1.3);     // 星命·史官
      }
      S.attrs[k] = clamp(S.attrs[k] + v);
      gains.push([k, v]);
    }
  }
  /* 倾向连续 */
  if(c.eff){
    let dom=null, best=0;
    for(const k of ['C','R','F']){ const x=Math.abs(c.eff[k]||0); if(x>best){best=x;dom=k;} }
    if(dom){
      for(const k of ['C','R','F']) S.curStreak[k] = (k===dom) ? S.curStreak[k]+1 : 0;
      for(const k of ['C','R','F']) S.bestStreak[k] = Math.max(S.bestStreak[k], S.curStreak[k]);
    }
  }
  /* 史实引力（星命·史官：偏离损耗减半） */
  if(!c.rift){
    S.pull = clamp(S.pull + (isReal ? 7 : (S.fate==='scribe' ? -5 : -9)));
    S.gripMax = Math.max(S.gripMax, S.pull);
    S.pullMin = Math.min(S.pullMin, S.pull);
    if(!isReal) S.deviations.push(ch.id);
  }
  /* 均衡追踪（星命·执秤人：判定放宽为 50–85） */
  const bLo = S.fate==='scale' ? 50 : 55, bHi = S.fate==='scale' ? 85 : 80;
  if(['C','R','F'].every(k=>S.attrs[k]>=bLo && S.attrs[k]<=bHi)) S.balanceCount++;

  /* flag / 隐藏星辉 */
  if(c.flag && !S.flags.includes(c.flag)) S.flags.push(c.flag);
  let newRift = null;
  if(c.rift && !S.secrets.includes(c.rift.id)){
    S.secrets.push(c.rift.id);
    S.stars.push({chapter: ch.id, name: c.rift.name, secret: true, title: ch.title, rid: c.rift.id});
    newRift = c.rift;
  }

  /* 本章完成 */
  const isLast = S.ri === ch.rounds.length - 1;
  let newStar = null, overloaded = [];
  if(isLast){
    ['C','R','F'].forEach(k=>{
      if(S.attrs[k] >= 95 && !S.overloads.includes(k)){
        S.attrs[k] = clamp(S.attrs[k] - 8);
        S.overloads.push(k);
        overloaded.push(k);
      }
    });
    if(overloaded.length) gains.push(...overloaded.map(k=>[k, -8]));
    if(!S.seen.includes(ch.id)){
      S.seen.push(ch.id);
      S.order.push(ch.id);
    }
    if(!S.views.includes(ch.id)) S.views.push(ch.id);
    newStar = {chapter: ch.id, name: ch.star.name, title: ch.title};
    if(!S.stars.some(x=>x.chapter===ch.id && !x.secret)) S.stars.push(newStar);
  }

  /* 周目记忆 */
  META.memory[`${ch.id}-${S.ri}`] = {idx, text: c.text};
  saveMeta();

  checkResonance();
  const newAch = checkAch();
  if(unlockBeyond()) checkAch();

  save();
  refreshHUD(gains);
  showResult({ch, rd, c, timeout, gains, newRift, newStar, isLast, newAch, isReal, overloaded});
}

    html += `<div class="starline">

      <div class="t3">${a.desc}</div>
    </div>`;
  });

  if(isLast){
    html += `<hr class="hr">
      <div class="small" style="letter-spacing:.2em;color:#8a7326;margin-bottom:8px">史 实 注 脚</div>
      <div class="small" style="line-height:1.9;color:#a9a396;margin-bottom:16px">${ch.ending.history}</div>

      <div id="viewSlot"></div>`;
  }

  let btns = '';
  if(!isLast){
    const canRw = S.attrs.F >= REWIND_MIN && !S.rewindChapters.includes(ch.id);
    btns = `${canRw ? `<button class="btn-sub" id="sheetRw" style="width:100%;margin-top:12px">↺ 星轨回溯 · 重新站到这个路口（−${REWIND_COST} 命运 · 本章一次）</button>` : ''}
      <button class="sheet-btn" id="sheetNext" style="margin-top:0">继续 · 第 ${S.ri+2} 次抉择</button>`;
  } else {
    btns = `<button class="sheet-btn" id="sheetShelf">回 到 档 案 架</button>`;
  }
  html += btns;

  $('sheet').innerHTML = html;
  $('overlay').classList.add('on');
  $('overlay').dataset.lock = '1';
  if($('btnView')) $('btnView').onclick = ()=>{
    $('btnView').style.display = 'none';

      <div class="vt">${ch.otherSide.title}</div>

  };

    $('overlay').classList.remove('on'); delete $('overlay').dataset.lock;
    S.ri++; save(); renderRound();
  };

    S.attrs.F = clamp(S.attrs.F - REWIND_COST);
    S.rewinds++;
    if(!S.rewindChapters.includes(ch.id)) S.rewindChapters.push(ch.id);
    if(S.times.length) S.times.pop();     // 回溯的那次不计入用时
    save(); checkAch();
    $('overlay').classList.remove('on'); delete $('overlay').dataset.lock;
    renderRound();
  };
  if($('sheetShelf')) $('sheetShelf').onclick = ()=>{
    $('overlay').classList.remove('on'); delete $('overlay').dataset.lock;
    S.ri = 0; save(); renderShelf();
  };
}

function deviationTop(){
  if(!S.deviations.length) return null;
  const cnt = {};
  S.deviations.forEach(id=>cnt[id]=(cnt[id]||0)+1);
  let best=null, n=0;
  for(const k in cnt){ if(cnt[k] > n){ n = cnt[k]; best = Number(k); } }
  return best ? {id:best, n} : null;
}
